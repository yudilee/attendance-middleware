<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Self-Service Portal — Login</title>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Login Card Container -->
    <div class="relative w-full max-w-md">
        <!-- Visual Glow Effect -->
        <div class="absolute -top-12 -left-12 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-12 -right-12 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl"></div>

        <!-- Glassmorphism Card -->
        <div class="relative rounded-2xl border border-white/10 bg-slate-900/60 backdrop-blur-xl p-8 shadow-2xl overflow-hidden">
            <div class="flex flex-col items-center text-center mb-8">
                <!-- Branding Icon -->
                <div class="h-16 w-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/25 mb-4">
                    <i class="ph-fill ph-fingerprint text-4xl text-white"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight">Employee Portal</h1>
                <p class="text-xs text-indigo-200/60 mt-1.5 font-medium uppercase tracking-wider">Self-Service Attendance Suite</p>
            </div>

            <!-- Error Banner -->
            {% if error %}
            <div class="mb-6 rounded-xl border border-red-500/20 bg-red-500/10 p-3.5 flex items-start gap-3 text-xs text-red-200/90 shadow-sm animate-pulse">
                <i class="ph-fill ph-warning-octagon text-lg text-red-400 flex-shrink-0"></i>
                <div>
                    <span class="font-bold">Authentication failed</span>
                    <p class="mt-0.5 opacity-80">{{ error }}</p>
                </div>
            </div>
            {% endif %}

            <!-- Form -->
            <form action="/portal/login" method="POST" class="space-y-5">
                <div>
                    <label for="employee_id" class="block text-xs font-semibold text-indigo-200/80 uppercase tracking-wider mb-2">Employee ID / PIN</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="ph ph-identification-badge text-lg"></i>
                        </span>
                        <input type="text" name="employee_id" id="employee_id" required autofocus
                            class="block w-full pl-11 pr-4 py-3 bg-slate-950/40 border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/10"
                            placeholder="Enter your registration ID...">
                    </div>
                </div>

                <button type="submit" 
                    class="w-full flex items-center justify-center gap-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 px-5 py-3 text-sm font-semibold text-white transition-all hover:scale-[1.01] hover:shadow-lg hover:shadow-indigo-600/30 active:scale-[0.99] shadow-md shadow-indigo-600/10">
                    <i class="ph ph-sign-in text-lg"></i>
                    Access Self-Service Dashboard
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/5 text-center text-[10px] text-slate-500">
                Authorized Personnel Only &bull; Attendance System Middleware v1.0
            </div>
        </div>
    </div>

</body>
</html>
