<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Attendance Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/static/css/styles.css?v=3">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }

        .login-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            color: white;
            font-size: 1.75rem;
        }

        .login-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-title h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.35rem;
        }

        .login-title p {
            font-size: 0.875rem;
            color: #64748b;
        }

        .login-error {
            background: #fef2f2;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            border: 1px solid #fca5a5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <i class="ph-fill ph-fingerprint"></i>
            </div>
            
            <div class="login-title">
                <h1>Welcome Back</h1>
                <p>Sign in to the attendance dashboard</p>
            </div>

            {% if error %}
            <div class="login-error">
                <i class="ph ph-warning-circle"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" 
                           required autofocus placeholder="Enter your username"
                           style="padding: 0.75rem 1rem; font-size: 0.95rem;">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" 
                           required placeholder="••••••••"
                           style="padding: 0.75rem 1rem; font-size: 0.95rem;">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-full" 
                        style="margin-top: 0.5rem; padding: 0.8rem;">
                    <i class="ph ph-sign-in"></i>
                    Sign In
                </button>
            </form>

            <div class="login-footer">
                Virtual Attendance Middleware v1.0
            </div>
        </div>
    </div>
</body>
</html>
