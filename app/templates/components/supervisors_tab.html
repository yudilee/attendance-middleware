<!-- ═══════════════════ SUPERVISORS TAB ═══════════════════ -->
{% if section == "supervisors" %}
<div class="supervisor-management">
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm mb-6">
        <h3 class="text-sm font-semibold text-slate-800 mb-4">Assign Supervisor to Employee</h3>
        <form id="supervisorForm" onsubmit="return assignSupervisor(event)">
            <div class="flex gap-4 items-end flex-wrap">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Supervisor (Employee ID)</label>
                    <input type="text" id="supervisor_id" class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="e.g., SUP001" required>
                </div>
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Team Member (Employee ID)</label>
                    <input type="text" id="employee_id" class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="e.g., EMP001" required>
                </div>
                <div>
                    <button type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 transition-all shadow-sm">Assign</button>
                </div>
            </div>
        </form>
    </div>
    
    <div class="rounded-xl border border-slate-200 bg-white shadow-sm mb-6">
        <div class="px-6 py-4 border-b border-slate-200">
            <h3 class="text-sm font-semibold text-slate-800">Current Assignments</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200">
                        <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">ID</th>
                        <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Supervisor</th>
                        <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Employee</th>
                        <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Created</th>
                        <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Actions</th>
                    </tr>
                </thead>
                <tbody id="supervisorAssignments" class="divide-y divide-slate-100">
                    <tr><td colspan="5" class="text-sm text-slate-400 px-5 py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
        <div class="px-6 py-4 border-b border-slate-200">
            <h3 class="text-sm font-semibold text-slate-800">Pending Attendance Corrections</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200">
                        <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Employee</th>
                        <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Type</th>
                        <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Description</th>
                        <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Date</th>
                        <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Actions</th>
                    </tr>
                </thead>
                <tbody id="pendingCorrections" class="divide-y divide-slate-100">
                    <tr><td colspan="5" class="text-sm text-slate-400 px-5 py-4">No pending corrections</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
async function assignSupervisor(event) {
  event.preventDefault();
  const supervisor_id = document.getElementById('supervisor_id').value;
  const employee_id = document.getElementById('employee_id').value;
  
  const response = await fetch('/ui/supervisors/assign', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({supervisor_id, employee_id})
  });
  
  if (response.ok) {
    notify('Supervisor assigned successfully');
    document.getElementById('supervisorForm').reset();
    loadSupervisorAssignments();
  } else {
    const data = await response.json();
    notify(data.detail || 'Failed to assign supervisor');
  }
}

async function removeAssignment(id) {
  if (!confirm('Are you sure you want to remove this assignment?')) return;
  
  const response = await fetch(`/ui/supervisors/assign/${id}`, {method: 'DELETE'});
  if (response.ok) {
    notify('Assignment removed');
    loadSupervisorAssignments();
  }
}

async function loadSupervisorAssignments() {
  const response = await fetch('/ui/supervisors/list');
  const data = await response.json();
  
  const tbody = document.getElementById('supervisorAssignments');
  if (data.assignments.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-sm text-slate-400 px-5 py-4 text-center">No assignments found</td></tr>';
    return;
  }
  
  tbody.innerHTML = data.assignments.map(a => `
    <tr class="hover:bg-slate-50 transition-colors">
      <td class="px-5 py-4 text-sm text-slate-700">${a.id}</td>
      <td class="px-5 py-4 text-sm text-slate-700">${a.supervisor_id}</td>
      <td class="px-5 py-4 text-sm text-slate-700">${a.employee_id}</td>
      <td class="px-5 py-4 text-sm text-slate-500">${new Date(a.created_at).toLocaleDateString()}</td>
      <td class="px-5 py-4"><button onclick="removeAssignment(${a.id})" class="inline-flex items-center gap-1.5 rounded-lg bg-red-50 border border-red-300 px-3 py-1.5 text-xs font-semibold text-red-700 hover:bg-red-100 transition-colors">Remove</button></td>
    </tr>
  `).join('');
}

// Load on page load
document.addEventListener('DOMContentLoaded', loadSupervisorAssignments);
</script>
{% endif %}
