<!-- ═══════════════════ USERS TAB ═══════════════════ -->
<div id="profile" class="tab-content hidden">
    <!-- User List Section -->
    <div id="userListSection" class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
        <!-- Change Own Password -->
        <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">My Security Credentials</div>
            <p class="text-sm text-slate-500 mb-6">
                Update your dashboard access password.
            </p>
            <form id="profileForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Admin Username</label>
                    <input type="text" id="admin_username" value="{{ admin.username }}" readonly class="block w-full rounded-lg border border-slate-300 bg-slate-100 px-4 py-2.5 text-sm text-slate-500 cursor-not-allowed">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">New Password</label>
                    <input type="password" id="admin_password" class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="••••••••" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirm New Password</label>
                    <input type="password" id="admin_password_confirm" class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="••••••••" required>
                </div>
                <button type="button" class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 transition-all shadow-sm" onclick="updateProfile()">🔐 Update Password</button>
            </form>
        </div>

        <!-- User List -->
        <div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
                <h3 class="text-sm font-semibold text-slate-800">System Administrators</h3>
                <button type="button" class="inline-flex items-center gap-1.5 rounded-lg bg-emerald-500 px-4 py-2 text-xs font-semibold text-white hover:bg-emerald-600 transition-all shadow-sm" onclick="openUserModal()">➕ Add User</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200">
                            <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Username</th>
                            <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Role</th>
                            <th class="px-5 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Created</th>
                            <th class="px-5 py-3.5 text-right text-xs font-semibold uppercase tracking-wider text-slate-500">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="divide-y divide-slate-100">
                        <tr><td colspan="4" class="text-center py-8 text-sm text-slate-400">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Admin User Form Section -->
    <div id="userFormSection" class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm hidden max-w-lg mx-auto mb-8">
        <div class="flex items-center justify-between mb-6">
            <div class="text-sm font-semibold text-slate-800" id="userFormTitle">Create Admin User</div>
            <button type="button" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-colors" onclick="closeUserModal()">← Back to List</button>
        </div>
        <form id="newUserForm">
            <input type="hidden" id="edit_user_id" value="">
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                <input type="text" id="new_user_name" class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="manager1" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                <input type="password" id="new_user_pwd" class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="Leave blank to keep" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Role</label>
                <select id="new_user_role" class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                    <option value="superadmin">Super Admin (Full Access)</option>
                    <option value="admin" selected>Admin (Standard Access)</option>
                    <option value="manager">Manager (View Logs & Assign Supervisors)</option>
                    <option value="operator">Operator (Read-Only Access)</option>
                </select>
            </div>
            <div class="flex gap-4">
                <button type="button" class="flex-1 inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors" onclick="closeUserModal()">Cancel</button>
                <button type="button" class="flex-1 inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 transition-all shadow-sm" id="saveUserBtn" onclick="saveUser()">Add</button>
            </div>
        </form>
    </div>
</div>
