<div id="companies" class="tab-content hidden">
    <!-- Companies list and cards -->
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm mb-6 dark:border-slate-800 dark:bg-slate-900">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div>
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1 dark:text-slate-400">Company Configurations</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400">
                    Manage multi-company setups, unique company identification codes, and default work policies for individual entities.
                </p>
            </div>
            <button class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700 transition-all shadow-sm" onclick="showCreateCompanyForm()">
                ➕ Add Company
            </button>
        </div>

        <!-- Cards Grid -->
        <div id="companiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Create/Edit Form (Card/Panel) -->
    <div id="companyFormContainer" class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm max-w-2xl hidden dark:border-slate-800 dark:bg-slate-900">
        <h2 class="text-sm font-semibold text-slate-800 mb-5 dark:text-slate-100" id="companyFormTitle">Create New Company</h2>
        
        <form id="companyForm" onsubmit="event.preventDefault(); saveCompanyDetails();">
            <input type="hidden" id="edit_company_id">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5 dark:text-slate-300">Company Name</label>
                    <input type="text" id="company_name" class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" placeholder="e.g., Acme Corporation" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5 dark:text-slate-300">Company Code (Unique)</label>
                    <input type="text" id="company_code" class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" placeholder="e.g., ACM" style="text-transform: uppercase;" required>
                    <small class="text-xs text-slate-400 mt-1 block dark:text-slate-500">Short identifier code (e.g. COA, COB).</small>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-1.5 dark:text-slate-300">Default Company Shift Schedule</label>
                <select id="company_shift_schedule_id" class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
                    <option value="">No Default Shift (Fallback to global default)</option>
                </select>
                <small class="text-xs text-slate-400 mt-1 block dark:text-slate-500">Default shift applied to all branches and employees in this company unless overridden.</small>
            </div>

            <!-- Set Active Status -->
            <div class="mb-6">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="company_is_active" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-4 w-4 dark:border-slate-700 dark:text-indigo-400">
                    <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Set as Active Entity</span>
                </label>
            </div>

            <div class="flex gap-4">
                <button type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 transition-all shadow-sm" id="saveCompanyBtn">
                    💾 Save Company Details
                </button>
                <button type="button" class="inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 px-5 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors dark:border-slate-700 dark:text-slate-400 dark:hover:bg-slate-800/40" onclick="hideCompanyForm()">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
