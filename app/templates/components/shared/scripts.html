<script>
    // Helper to reset all views
    function resetAllViews() {
        // Reset Devices Tab
        const devForm = document.getElementById('deviceFormSection');
        const devAssign = document.getElementById('assignFormSection');
        const devList = document.getElementById('devicesListSection');
        if (devForm) devForm.style.display = 'none';
        if (devAssign) devAssign.style.display = 'none';
        if (devList) devList.style.display = 'block';
        const onboardM = document.getElementById('onboardModal');
        if (onboardM) onboardM.style.display = 'none';
        
        // Reset Branches Tab
        const brForm = document.getElementById('branchFormSection');
        const brList = document.getElementById('branchListSection');
        if (brForm) brForm.style.display = 'none';
        if (brList) brList.style.display = 'block';
        
        // Reset API Keys Tab
        const keyAdd = document.getElementById('apiKeyFormSection');
        const keyEdit = document.getElementById('apiKeyEditFormSection');
        const keyList = document.getElementById('apiKeyListSection');
        if (keyAdd) keyAdd.style.display = 'none';
        if (keyEdit) keyEdit.style.display = 'none';
        if (keyList) keyList.style.display = 'block';
        
        // Reset Users Tab
        const usrForm = document.getElementById('userFormSection');
        const usrList = document.getElementById('userListSection');
        if (usrForm) usrForm.style.display = 'none';
        if (usrList) usrList.style.display = 'grid';
        const ownPwd = document.getElementById('admin_password');
        const ownPwdConf = document.getElementById('admin_password_confirm');
        if (ownPwd) ownPwd.value = '';
        if (ownPwdConf) ownPwdConf.value = '';

        // Reset Punch Types Form
        if (typeof cancelPtEdit === 'function') {
            cancelPtEdit();
        }
        
        // Close generic Confirm Modal if open
        const confirmM = document.getElementById('confirmModal');
        if (confirmM) confirmM.style.display = 'none';
    }

    // Helper to switch tabs (re-definition for proper scope)
    function showTab(tabId) {
        // Reset all editable/form views
        resetAllViews();

        document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        // Hide standalone sections
        const supervisorDiv = document.querySelector('.supervisor-management');
        if (supervisorDiv) supervisorDiv.style.display = 'none';
        
        const content = document.getElementById(tabId);
        if (content) {
            content.style.display = 'block';
            const navItem = document.querySelector(`.nav-item[data-tab="${tabId}"]`);
            if (navItem) {
                navItem.classList.add('active');
                document.getElementById('page-title').innerText = navItem.innerText.trim();
            }
            
            // Trigger load data
            if (tabId === 'security') loadApiKeys();
            if (tabId === 'geofence') { loadBranches(); initBranchMap(); }
            if (tabId === 'profile') loadUsers();
            if (tabId === 'punch-types') loadPunchTypes();
            if (tabId === 'settings') loadAdmsSyncSettings();
            if (tabId === 'employees') loadEmployees();
            if (tabId === 'roster') loadRosterPlanner();
        }
    }

    // Navigation switching (re-bind to avoid duplication with layout)
    document.querySelectorAll('.nav-item[data-tab]').forEach(tab => {
        tab.addEventListener('click', (e) => {
            if (window.location.pathname === '/ui' || window.location.pathname === '/ui/') {
                e.preventDefault();
                const targetTab = tab.dataset.tab;
                showTab(targetTab);
                window.location.hash = targetTab;
            }
        });
    });

    function localizeTimestamps() {
        document.querySelectorAll('.local-time').forEach(el => {
            const utcStr = el.getAttribute('data-utc');
            if (utcStr) {
                const localDate = new Date(utcStr);
                if (!isNaN(localDate.getTime())) {
                    const year = localDate.getFullYear();
                    const month = String(localDate.getMonth() + 1).padStart(2, '0');
                    const day = String(localDate.getDate()).padStart(2, '0');
                    const hours = String(localDate.getHours()).padStart(2, '0');
                    const minutes = String(localDate.getMinutes()).padStart(2, '0');
                    const seconds = String(localDate.getSeconds()).padStart(2, '0');
                    el.textContent = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                }
            }
        });
    }

    function initLivePunchFeed() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/api/v1/punch/stream`;
        
        const wsStatusBadge = document.getElementById('wsConnectionStatus');
        const liveTickerPlaceholder = document.getElementById('liveTickerPlaceholder');
        const liveTickerList = document.getElementById('liveTickerList');
        const liveLogsBody = document.getElementById('liveAttendanceLogsBody');
        const noLogsRow = document.getElementById('noLogsRow');
        
        let socket;
        
        function connect() {
            socket = new WebSocket(wsUrl);
            
            socket.onopen = () => {
                if (wsStatusBadge) {
                    wsStatusBadge.textContent = 'Live Feed Online';
                    wsStatusBadge.className = 'text-[10px] bg-emerald-100 text-emerald-800 font-mono px-2 py-0.5 rounded-full font-bold dark:bg-emerald-950/30 dark:text-emerald-400';
                }
            };
            
            socket.onclose = () => {
                if (wsStatusBadge) {
                    wsStatusBadge.textContent = 'Disconnected (Reconnecting...)';
                    wsStatusBadge.className = 'text-[10px] bg-amber-100 text-amber-800 font-mono px-2 py-0.5 rounded-full font-bold animate-pulse dark:bg-amber-950/30 dark:text-amber-400';
                }
                setTimeout(connect, 3000);
            };
            
            socket.onerror = (err) => {
                console.error('WebSocket Error:', err);
                socket.close();
            };
            
            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    // Handle device onboarding events
                    if (data.type === 'device_onboarded') {
                        // Close the onboarding modal
                        const onboardM = document.getElementById('onboardModal');
                        if (onboardM) {
                            onboardM.classList.add('hidden');
                            onboardM.style.display = 'none';
                        }
                        
                        // Reset views back to device list
                        resetAllViews();
                        
                        // Refresh the device table via AJAX
                        refreshDevicesTable();
                        
                        // Show notification
                        notify(`Device registered: ${data.employee_name} (${data.employee_id}) is now active!`, 'success');
                        return;
                    }
                    
                    if (liveTickerPlaceholder) liveTickerPlaceholder.classList.add('hidden');
                    if (liveTickerList) liveTickerList.classList.remove('hidden');
                    
                    const timeLocal = new Date().toLocaleTimeString();
                    const tickerItem = document.createElement('div');
                    tickerItem.className = 'flex items-center justify-between bg-white dark:bg-slate-900 border border-indigo-50 dark:border-slate-800 rounded-lg p-2.5 shadow-sm transform translate-y-2 opacity-0 transition-all duration-500 ease-out border-l-4 ' + (data.punch_type === 'In' ? 'border-l-emerald-500' : 'border-l-red-500');
                    tickerItem.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="flex h-6 w-6 items-center justify-center rounded-full ${data.punch_type === 'In' ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/30 dark:text-emerald-400' : 'bg-red-50 text-red-700 dark:bg-red-950/30 dark:text-red-400'} text-[10px] font-bold">
                                ${data.punch_type === 'In' ? 'IN' : 'OUT'}
                            </span>
                            <div>
                                <div class="text-xs font-bold text-slate-800 dark:text-slate-100">${data.employee_name}</div>
                                <div class="text-[10px] text-slate-400 dark:text-slate-500">ID: ${data.employee_id} &bull; GPS: ${parseFloat(data.latitude).toFixed(5)}, ${parseFloat(data.longitude).toFixed(5)}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] font-mono font-bold text-indigo-600 dark:text-indigo-400">${timeLocal}</div>
                            <div class="text-[9px] text-slate-400 font-semibold dark:text-slate-500">${data.adms_status === 'uploaded' ? '✅ ADMS' : '⏳ Pending'}</div>
                        </div>
                    `;
                    
                    if (liveTickerList) {
                        liveTickerList.insertBefore(tickerItem, liveTickerList.firstChild);
                        setTimeout(() => {
                            tickerItem.classList.remove('translate-y-2', 'opacity-0');
                        }, 50);
                        
                        if (liveTickerList.children.length > 5) {
                            liveTickerList.removeChild(liveTickerList.lastChild);
                        }
                    }
                    
                    if (liveLogsBody) {
                        if (noLogsRow) noLogsRow.remove();
                        
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors bg-indigo-50/20 dark:bg-indigo-950/10';
                        
                        const dateStr = data.timestamp ? new Date(data.timestamp).toISOString().slice(0, 19).replace('T', ' ') : new Date().toISOString().slice(0, 19).replace('T', ' ');
                        
                        const selfieHtml = data.selfie_filename 
                            ? `<a href="/ui/selfie/${data.selfie_filename}" target="_blank" class="inline-flex items-center gap-1.5 rounded-lg border border-indigo-200 bg-indigo-50 px-3 py-1.5 text-xs font-semibold text-indigo-700 hover:bg-indigo-100 transition-colors dark:border-indigo-800/60 dark:bg-indigo-950/30 dark:text-indigo-400"><i class="ph ph-camera"></i> View</a>` 
                            : `<span class="text-slate-400 dark:text-slate-500">&mdash;</span>`;
                        
                        const typeBadgeHtml = data.punch_type === 'In'
                            ? `<span class="inline-flex items-center rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 dark:bg-emerald-950/30 dark:text-emerald-400">🟢 In</span>`
                            : `<span class="inline-flex items-center rounded-full bg-red-50 px-2.5 py-0.5 text-xs font-semibold text-red-700 dark:bg-red-950/30 dark:text-red-400">🔴 Out</span>`;
                            
                        const statusBadgeHtml = data.adms_status === 'uploaded'
                            ? `<span class="inline-flex items-center rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 dark:bg-emerald-950/30 dark:text-emerald-400">✅ Uploaded</span>`
                            : data.adms_status === 'failed'
                            ? `<span class="inline-flex items-center rounded-full bg-red-50 px-2.5 py-0.5 text-xs font-semibold text-red-700 dark:bg-red-950/30 dark:text-red-400">❌ Failed</span>`
                            : `<span class="inline-flex items-center rounded-full bg-amber-50 px-2.5 py-0.5 text-xs font-semibold text-amber-700 dark:bg-amber-950/30 dark:text-amber-400">⏳ Pending</span>`;
                        
                        tr.innerHTML = `
                            <td class="px-5 py-4">
                                <strong class="text-slate-800 dark:text-slate-100">${data.employee_name}</strong><br>
                                <span class="text-xs text-slate-400 dark:text-slate-500">ID: ${data.employee_id}</span>
                            </td>
                            <td class="px-5 py-4 text-sm text-slate-700 local-time dark:text-slate-300" data-utc="${data.timestamp}">${dateStr}</td>
                            <td class="px-5 py-4">${typeBadgeHtml}</td>
                            <td class="px-5 py-4 text-xs text-slate-400 font-mono dark:text-slate-500">${parseFloat(data.latitude).toFixed(5)}, ${parseFloat(data.longitude).toFixed(5)}</td>
                            <td class="px-5 py-4">${statusBadgeHtml}</td>
                            <td class="px-5 py-4">${selfieHtml}</td>
                        `;
                        
                        liveLogsBody.insertBefore(tr, liveLogsBody.firstChild);
                        
                        if (liveLogsBody.children.length > 20) {
                            liveLogsBody.removeChild(liveLogsBody.lastChild);
                        }
                        
                        localizeTimestamps();
                    }
                    
                    const statsCountEl = document.querySelector('.text-3xl.font-bold.text-slate-800');
                    if (statsCountEl) {
                        const curCount = parseInt(statsCountEl.textContent);
                        if (!isNaN(curCount)) {
                            statsCountEl.textContent = curCount + 1;
                        }
                    }
                    
                } catch (e) {
                    console.error('Error parsing live feed message:', e);
                }
            };
        }
        
        connect();
    }

    // Handle initial load and back/forward navigation
    window.addEventListener('load', () => {
        localizeTimestamps();
        initLivePunchFeed();
        if (window.location.pathname === '/ui' || window.location.pathname === '/ui/') {
            const hash = window.location.hash.replace('#', '') || 'dashboard';
            showTab(hash);
        }
    });

    window.addEventListener('hashchange', () => {
        if (window.location.pathname === '/ui' || window.location.pathname === '/ui/') {
            const hash = window.location.hash.replace('#', '') || 'dashboard';
            showTab(hash);
        }
    });

    // ── ADMS Settings ──────────────────────────────────────────────────────────
    async function saveSettings() {
        const url = document.getElementById('server_url').value.trim();
        const sn = document.getElementById('serial_number').value.trim();
        const device_name = document.getElementById('device_name').value.trim();
        const timezone_offset = parseInt(document.getElementById('timezone_offset').value) || 7;
        const res = await fetch('/ui/settings', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({server_url: url, serial_number: sn, device_name: device_name, timezone_offset: timezone_offset})
        });
        if (res.ok) { notify('ADMS Configuration saved!'); setTimeout(() => location.reload(), 800); }
        else notify('Failed to save settings', 'error');
    }

    async function testConnection() {
        const url = document.getElementById('server_url').value.trim();
        const sn = document.getElementById('serial_number').value.trim();
        const device_name = document.getElementById('device_name').value.trim();
        const timezone_offset = parseInt(document.getElementById('timezone_offset').value) || 7;
        const board = document.getElementById('testResult');
        board.style.display = 'block';
        board.className = 'mt-6 p-4 rounded-xl font-mono text-sm border border-slate-200 bg-slate-50 whitespace-pre-wrap dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100';
        board.innerText = '> Sending handshake to ADMS server...\n> SN: ' + sn + ' (' + device_name + ')';
        try {
            const res = await fetch('/ui/test-connection', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    server_url: url, 
                    serial_number: sn, 
                    device_name: device_name,
                    timezone_offset: timezone_offset
                })
            });
            const data = await res.json();
            board.className = data.success 
                ? 'mt-6 p-4 rounded-xl font-mono text-sm border border-emerald-300 bg-emerald-50 text-emerald-800 whitespace-pre-wrap dark:border-emerald-800 dark:bg-emerald-950/30 dark:text-emerald-400'
                : 'mt-6 p-4 rounded-xl font-mono text-sm border border-red-300 bg-red-50 text-red-700 whitespace-pre-wrap dark:border-red-900/30 dark:bg-red-950/30 dark:text-red-400';
            board.innerText = '> Status: ' + (data.success ? 'SUCCESS ✅' : 'FAILED ❌') + '\n> ' + data.message;
        } catch(e) {
            board.className = 'mt-6 p-4 rounded-xl font-mono text-sm border border-red-300 bg-red-50 text-red-700 whitespace-pre-wrap dark:border-red-900/30 dark:bg-red-950/30 dark:text-red-400';
            board.innerText = '> Error: Could not reach the middleware server.';
        }
    }

    async function loadAdmsSyncSettings() {
        const res = await fetch('/ui/adms-credentials');
        if (res.ok) {
            const data = await res.json();
            document.getElementById('sync_url').value = data.url || '';
            document.getElementById('sync_username').value = data.username || '';
            document.getElementById('sync_password').value = data.password || '';
        }
        updateSyncInfo();
        loadSmtpSettings();
    }

    async function loadSmtpSettings() {
        try {
            const res = await fetch('/ui/app-settings/smtp');
            if (res.ok) {
                const data = await res.json();
                document.getElementById('smtp_host').value = data.smtp_host || '';
                document.getElementById('smtp_port').value = data.smtp_port || 587;
                document.getElementById('smtp_user').value = data.smtp_user || '';
                document.getElementById('hr_email_recipients').value = data.hr_email_recipients || '';
                if (data.smtp_password_set) {
                    document.getElementById('smtp_password').placeholder = '•••••••• (Saved)';
                    document.getElementById('smtp_password').value = '__UNCHANGED__';
                } else {
                    document.getElementById('smtp_password').placeholder = '••••••••';
                    document.getElementById('smtp_password').value = '';
                }
            }
        } catch (e) {
            console.error('Error loading SMTP settings:', e);
        }
    }

    async function saveSmtpSettings() {
        const host = document.getElementById('smtp_host').value.trim();
        const port = parseInt(document.getElementById('smtp_port').value) || 587;
        const user = document.getElementById('smtp_user').value.trim();
        const password = document.getElementById('smtp_password').value;
        const recipients = document.getElementById('hr_email_recipients').value.trim();

        if (!host || !user || !recipients) {
            notify('Host, Username, and Recipients are required!', 'error');
            return;
        }

        const res = await fetch('/ui/app-settings/smtp', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                smtp_host: host,
                smtp_port: port,
                smtp_user: user,
                smtp_password: password,
                hr_email_recipients: recipients
            })
        });

        if (res.ok) {
            notify('HR SMTP Settings saved successfully!');
            loadSmtpSettings();
        } else {
            notify('Failed to save SMTP settings', 'error');
        }
    }

    function toggleSmtpPassword() {
        const input = document.getElementById('smtp_password');
        const icon = document.getElementById('smtpEyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.025 10.025 0 014.132-5.4M9.69 9.69a3 3 0 004.62 4.62M18.364 18.364l-12.729-12.73" />
            `;
        } else {
            input.type = 'password';
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            `;
        }
    }


    async function updateSyncInfo() {
        try {
            const res = await fetch('/ui/adms-sync-info');
            const data = await res.json();
            document.getElementById('statLastSync').innerText = data.last_sync;
            document.getElementById('statLastCount').innerText = data.last_count;
            document.getElementById('statTotalEmployees').innerText = data.total_employees;
            
            const statusEl = document.getElementById('statStatus');
            statusEl.innerText = data.last_status.toUpperCase();
            if (data.last_status === 'success') {
                statusEl.className = 'inline-flex items-center rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 dark:bg-emerald-950/30 dark:text-emerald-400';
            } else if (data.last_status.startsWith('failed')) {
                statusEl.className = 'inline-flex items-center rounded-full bg-red-50 px-2.5 py-0.5 text-xs font-semibold text-red-700 dark:bg-red-950/30 dark:text-red-400';
            } else {
                statusEl.className = 'inline-flex items-center rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-semibold text-slate-600 dark:bg-slate-800 dark:text-slate-400';
            }
        } catch(e) {}
    }

    async function saveAdmsSyncSettings() {
        const url = document.getElementById('sync_url').value.trim();
        const username = document.getElementById('sync_username').value.trim();
        const password = document.getElementById('sync_password').value.trim();
        const res = await fetch('/ui/adms-credentials', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url: url, username: username, password: password})
        });
        if (res.ok) notify('Sync credentials saved!');
        else notify('Failed to save sync credentials', 'error');
    }

    async function triggerAdmsSync() {
        const btn = document.getElementById('btnSyncNow');
        btn.innerText = '🔄 Syncing...';
        btn.disabled = true;
        try {
            const res = await fetch('/ui/adms-sync', { method: 'POST' });
            if (res.ok) {
                const data = await res.json();
                notify(data.message);
                updateSyncInfo();
                if (document.getElementById('profile').style.display === 'block') loadUsers();
            } else {
                const e = await res.json();
                notify(e.detail || 'Sync failed', 'error');
                updateSyncInfo();
            }
        } catch(e) {
            notify('Server error during sync', 'error');
        } finally {
            btn.innerText = '🔄 Sync Now';
            btn.disabled = false;
        }
    }

    // ── Device List AJAX Refresh (no page reload) ──────────────────────────────
    async function refreshDevicesTable() {
        try {
            const res = await fetch('/ui/devices/list');
            if (!res.ok) throw new Error('Failed to fetch devices');
            const devices = await res.json();
            
            const tbody = document.querySelector('#devicesTableBody');
            if (!tbody) return;
            
            // Get max_devices from the first device or use default
            const maxDevices = devices.length > 0 ? (devices[0].max_devices || 5) : 5;
            
            if (devices.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-sm text-slate-400 dark:text-slate-500">No devices registered yet.</td></tr>';
                return;
            }
            
            tbody.innerHTML = devices.map(device => {
                const statusClass = device.registration_status === 'pending_approval' ? 'bg-amber-50/50 dark:bg-amber-950/20' :
                                   device.registration_status === 'suspended' ? 'bg-red-50/50 dark:bg-red-950/20 opacity-80' : '';
                
                const employeeHtml = device.employee_id ? `
                    <strong class="text-slate-800 dark:text-slate-100">${device.employee_name || 'Unknown'}</strong><br>
                    <span class="text-xs text-slate-400 dark:text-slate-500">
                        ID: ${device.employee_id} | ${device.device_label || '(no label)'}
                    </span><br>
                    <span class="text-xs font-semibold text-indigo-500 dark:text-indigo-400">
                        🔑 Key: ${device.api_key_label || 'N/A'}
                    </span>
                ` : `
                    <div class="bg-amber-50 p-2 border border-dashed border-amber-400 rounded-lg dark:bg-amber-950/30 dark:border-amber-800/50">
                        <span class="text-xs text-amber-700 block mb-1 dark:text-amber-400">⚠️ No Employee Assigned</span>
                        <button type="button" class="inline-flex items-center rounded-full bg-amber-500 px-2.5 py-1 text-xs font-semibold text-white border-0 cursor-pointer hover:bg-amber-600" onclick="openAssignDialog(${device.id}, '${(device.device_label || 'New Device').replace(/'/g, "\\'")}')">➕ Assign Employee</button>
                    </div>
                `;
                
                const deviceCountHtml = device.device_count ? `
                    <span class="font-semibold ${device.device_count >= maxDevices ? 'text-red-500' : 'text-slate-700'}">
                        ${device.device_count}/${maxDevices}
                    </span>
                ` : '—';
                
                const isActiveHtml = device.is_active ?
                    '<span class="inline-flex items-center rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 dark:bg-emerald-950/30 dark:text-emerald-400">Active</span>' :
                    '<span class="inline-flex items-center rounded-full bg-indigo-50 px-2.5 py-0.5 text-xs font-semibold text-indigo-600 dark:bg-indigo-950/30 dark:text-indigo-400">Inactive</span>';
                
                const statusHtml = device.registration_status === 'pending_approval' ?
                    '<span class="inline-flex items-center rounded-full bg-amber-50 px-2.5 py-0.5 text-xs font-semibold text-amber-700 dark:bg-amber-950/30 dark:text-amber-400">⏳ Pending</span>' :
                    (device.registration_status === 'approved' || device.registration_status === 'active') ?

    // ── Device Actions ─────────────────────────────────────────────────────────
    async function unbindDevice(id) {
        if (!confirm('Permanently remove this device registration?')) return;
        const res = await fetch(`/ui/devices/${id}/unbind`, {method: 'DELETE'});
        if (res.ok) { notify('Device removed'); location.reload(); }
        else notify('Action failed', 'error');
    }

    async function approveDevice(id) {
        const res = await fetch(`/ui/devices/${id}/approve`, {method: 'POST'});
        if (res.ok) { notify(`Device approved ✅`); location.reload(); }
        else { const e = await res.json(); notify(e.detail || 'Failed', 'error'); }
    }

    async function suspendDevice(id) {
        if (!confirm(`Suspend this device? It will not be able to punch.`)) return;
        const res = await fetch(`/ui/devices/${id}/suspend`, {method: 'POST'});
        if (res.ok) { notify(`Device suspended`); location.reload(); }
        else { const e = await res.json(); notify(e.detail || 'Failed', 'error'); }
    }

    let _allBranches = [];

    async function openDeviceModal(bindingId, currentLabel) {
        document.getElementById('edit_device_id').value = bindingId;
        document.getElementById('edit_device_label').value = currentLabel || '';
        document.getElementById('deviceBranchesList').innerHTML = '<span class="text-sm text-slate-400 dark:text-slate-500">Loading assigned branches...</span>';
        
        if (_allBranches.length === 0) {
            try {
                const res = await fetch('/ui/branches');
                _allBranches = await res.json();
            } catch(e) {
                console.error("Failed to load branches", e);
            }
        }

        document.getElementById('devicesListSection').style.display = 'none';
        document.getElementById('assignFormSection').style.display = 'none';
        document.getElementById('deviceFormSection').style.display = 'block';
        await refreshDeviceBranches(bindingId);
    }

    async function refreshDeviceBranches(bindingId) {
        try {
            const res = await fetch(`/ui/devices/${bindingId}/branches`);
            const assignedBranches = await res.json();
            
            const listDiv = document.getElementById('deviceBranchesList');
            if (assignedBranches.length === 0) {
                listDiv.innerHTML = '<span class="text-sm text-slate-400 dark:text-slate-500">No branches assigned yet. This device can punch anywhere!</span>';
            } else {
                listDiv.innerHTML = assignedBranches.map(b => `
                    <span class="inline-flex items-center gap-1.5 rounded-full bg-indigo-50 px-3 py-1 text-xs font-semibold text-indigo-700 dark:bg-indigo-950/30 dark:text-indigo-400">
                        ${b.branch_name}
                        <span onclick="removeDeviceBranchFromModal(${bindingId}, ${b.branch_id})" class="cursor-pointer text-sm font-bold leading-none text-indigo-300 hover:text-indigo-500" title="Remove branch">×</span>
                    </span>
                `).join('');
            }

            const assignedIds = new Set(assignedBranches.map(b => b.branch_id));
            const availableBranches = _allBranches.filter(b => !assignedIds.has(b.id));
            
            const select = document.getElementById('deviceBranchSelect');
            if (availableBranches.length === 0) {
                document.getElementById('addDeviceBranchGroup').style.display = 'none';
            } else {
                document.getElementById('addDeviceBranchGroup').style.display = 'flex';
                select.innerHTML = availableBranches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
            }
        } catch(e) {
            notify('Error loading device branches', 'error');
        }
    }

    async function removeDeviceBranchFromModal(bindingId, branchId) {
        const res = await fetch(`/ui/devices/${bindingId}/branches/${branchId}`, {method: 'DELETE'});
        if (res.ok) {
            notify('Branch removed from device');
            await refreshDeviceBranches(bindingId);
        } else {
            notify('Failed to remove branch', 'error');
        }
    }

    async function submitAddDeviceBranch() {
        const bindingId = document.getElementById('edit_device_id').value;
        const select = document.getElementById('deviceBranchSelect');
        const branchId = select.value;
        if (!branchId) return;

        const res = await fetch(`/ui/devices/${bindingId}/branches/${branchId}`, {method: 'POST'});
        if (res.ok) {
            notify('Branch added to device');
            await refreshDeviceBranches(bindingId);
        } else {
            notify('Failed to add branch', 'error');
        }
    }

    async function saveDeviceLabel() {
        const bindingId = document.getElementById('edit_device_id').value;
        const label = document.getElementById('edit_device_label').value.trim();
        
        const res = await fetch(`/ui/devices/${bindingId}/label`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({label: label, notes: ''})
        });
        if (res.ok) {
            notify('Device label updated successfully');
            closeDeviceModal();
            location.reload();
        } else {
            notify('Failed to update label', 'error');
        }
    }

    function closeDeviceModal() {
        document.getElementById('deviceFormSection').style.display = 'none';
        document.getElementById('assignFormSection').style.display = 'none';
        document.getElementById('devicesListSection').style.display = 'block';
    }

    // ── Branches (Geofence) ─────────────────────────────────────────────────────
    let currentBranches = [];
    let branchMap = null;
    let branchMarker = null;
    let branchCircle = null;
    let branchPolygon = null;
    let branchMapInitialized = false;
    let checkpointLayers = [];
    let tempCheckpointMarker = null;
    let tempCheckpointCircle = null;
    let tempCheckpointPolygon = null;
    let mapMode = 'primary';

    function setMapMode(mode) {
        mapMode = mode;
        const btnPrimary = document.getElementById('mapModePrimary');
        const btnCheckpoint = document.getElementById('mapModeCheckpoint');
        if (!btnPrimary || !btnCheckpoint) return;
        
        if (mode === 'primary') {
            btnPrimary.className = "flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-md transition-all bg-white text-indigo-600 shadow-sm border border-slate-200/50 dark:bg-slate-900 dark:text-indigo-400 dark:border-slate-800";
            btnCheckpoint.className = "flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-md transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/40";
            
            // Hide checkpoint temporary layers in primary mode
            if (tempCheckpointMarker && branchMap && branchMap.hasLayer(tempCheckpointMarker)) branchMap.removeLayer(tempCheckpointMarker);
            if (tempCheckpointCircle && branchMap && branchMap.hasLayer(tempCheckpointCircle)) branchMap.removeLayer(tempCheckpointCircle);
            if (tempCheckpointPolygon && branchMap && branchMap.hasLayer(tempCheckpointPolygon)) branchMap.removeLayer(tempCheckpointPolygon);
            
            // Re-show primary branch layers (if circular radius)
            const isCircle = document.getElementById('branch_geofence_type').value === 'circle';
            if (isCircle && branchMap) {
                if (branchMarker) branchMarker.addTo(branchMap);
                if (branchCircle) branchCircle.addTo(branchMap);
            }
        } else {
            btnPrimary.className = "flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-md transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/40";
            btnCheckpoint.className = "flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-md transition-all bg-white text-amber-600 shadow-sm border border-slate-200/50 dark:bg-slate-900 dark:text-amber-400 dark:border-slate-800";
            
            // Hide primary branch layers
            if (branchMarker && branchMap && branchMap.hasLayer(branchMarker)) branchMap.removeLayer(branchMarker);
            if (branchCircle && branchMap && branchMap.hasLayer(branchCircle)) branchMap.removeLayer(branchCircle);
            
            // Show checkpoint temporary layers (if circular)
            const cpType = document.getElementById('cp_geofence_type').value || 'circle';
            if (cpType === 'circle' && branchMap) {
                const lat = parseFloat(document.getElementById('cp_lat').value) || parseFloat(document.getElementById('branch_lat').value) || -6.175392;
                const lon = parseFloat(document.getElementById('cp_lon').value) || parseFloat(document.getElementById('branch_lon').value) || 106.827153;
                const rad = parseFloat(document.getElementById('cp_rad').value) || 50;
                
                if (!tempCheckpointMarker) {
                    tempCheckpointMarker = L.marker([lat, lon], {
                        draggable: true,
                        title: "New Checkpoint Location",
                        icon: L.icon({
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
                            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                            iconSize: [25, 41],
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34],
                            shadowSize: [41, 41]
                        })
                    });
                    tempCheckpointMarker.on('dragend', function() {
                        const pos = tempCheckpointMarker.getLatLng();
                        document.getElementById('cp_lat').value = pos.lat.toFixed(6);
                        document.getElementById('cp_lon').value = pos.lng.toFixed(6);
                        if (tempCheckpointCircle) tempCheckpointCircle.setLatLng(pos);
                    });
                }
                tempCheckpointMarker.setLatLng([lat, lon]).addTo(branchMap);
                
                if (!tempCheckpointCircle) {
                    tempCheckpointCircle = L.circle([lat, lon], {radius: rad, color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 0.1, weight: 2});
                }
                tempCheckpointCircle.setLatLng([lat, lon]).setRadius(rad).addTo(branchMap);
            }
        }
    }

    function setCheckpointCoordinates(latlng) {
        document.getElementById('cp_lat').value = latlng.lat.toFixed(6);
        document.getElementById('cp_lon').value = latlng.lng.toFixed(6);
        
        const radius = parseFloat(document.getElementById('cp_rad').value) || 50;

        if (tempCheckpointMarker) {
            tempCheckpointMarker.setLatLng(latlng);
        } else {
            tempCheckpointMarker = L.marker(latlng, {
                draggable: true,
                title: "New Checkpoint Location",
                icon: L.icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                })
            }).addTo(branchMap);
            
            tempCheckpointMarker.on('dragend', function() {
                const pos = tempCheckpointMarker.getLatLng();
                document.getElementById('cp_lat').value = pos.lat.toFixed(6);
                document.getElementById('cp_lon').value = pos.lng.toFixed(6);
                if (tempCheckpointCircle) {
                    tempCheckpointCircle.setLatLng(pos);
                }
            });
        }

        if (tempCheckpointCircle) {
            tempCheckpointCircle.setLatLng(latlng);
            tempCheckpointCircle.setRadius(radius);
        } else {
            tempCheckpointCircle = L.circle(latlng, {
                radius: radius,
                color: '#f59e0b',
                fillColor: '#f59e0b',
                fillOpacity: 0.15,
                weight: 2
            }).addTo(branchMap);
        }

        notify("Set checkpoint coordinates on map! Adjust coordinates or radius in the form, then click 'Add Point'.");
    }

    function onCheckpointCoordChange() {
        const lat = parseFloat(document.getElementById('cp_lat').value);
        const lon = parseFloat(document.getElementById('cp_lon').value);
        const rad = parseFloat(document.getElementById('cp_rad').value) || 50;
        
        if (!isNaN(lat) && !isNaN(lon) && branchMap) {
            const latlng = [lat, lon];
            if (tempCheckpointMarker) {
                tempCheckpointMarker.setLatLng(latlng);
            } else {
                tempCheckpointMarker = L.marker(latlng, {
                    draggable: true,
                    title: "New Checkpoint Location",
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        shadowSize: [41, 41]
                    })
                }).addTo(branchMap);
            }
            
            if (tempCheckpointCircle) {
                tempCheckpointCircle.setLatLng(latlng);
                tempCheckpointCircle.setRadius(rad);
            } else {
                tempCheckpointCircle = L.circle(latlng, {
                    radius: rad,
                    color: '#f59e0b',
                    fillColor: '#f59e0b',
                    fillOpacity: 0.15,
                    weight: 2
                }).addTo(branchMap);
            }
        }
    }

    function updateGeomanToolbarVisibility() {
        if (!branchMap) return;
        const isPolygon = document.getElementById('branch_geofence_type').value === 'polygon';
        const cpIsPolygon = document.getElementById('cp_geofence_type').value === 'polygon';
        
        if (isPolygon || cpIsPolygon) {
            branchMap.pm.addControls({
                position: 'topleft',
                drawMarker: false,
                drawCircleMarker: false,
                drawPolyline: false,
                drawRectangle: true,
                drawPolygon: true,
                drawCircle: false,
                editMode: true,
                dragMode: true,
                removalMode: true
            });
        } else {
            branchMap.pm.removeControls();
        }
    }

    function initBranchMap() {
        const container = document.getElementById('branchMap');
        if (!container || container._leaflet_id) return;

        const defaultLat = -6.175392;
        const defaultLon = 106.827153;

        branchMap = L.map('branchMap', { zoomControl: true, doubleClickZoom: false }).setView([defaultLat, defaultLon], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19,
        }).addTo(branchMap);

        // Initialize Geoman Controls
        updateGeomanToolbarVisibility();

        branchMarker = L.marker([defaultLat, defaultLon], { draggable: true }).addTo(branchMap);
        branchCircle = L.circle([defaultLat, defaultLon], {
            radius: 50, color: '#6366f1', fillColor: '#6366f1', fillOpacity: 0.1, weight: 2
        }).addTo(branchMap);

        branchMarker.on('dragend', function() {
            const pos = branchMarker.getLatLng();
            document.getElementById('branch_lat').value = pos.lat.toFixed(6);
            document.getElementById('branch_lon').value = pos.lng.toFixed(6);
            updateCircle();
        });

        branchMap.on('click', function(e) {
            const isPolygon = document.getElementById('branch_geofence_type').value === 'polygon';
            if (mapMode === 'primary') {
                if (isPolygon) return; // Do not place marker in polygon draw mode
                branchMarker.setLatLng(e.latlng);
                document.getElementById('branch_lat').value = e.latlng.lat.toFixed(6);
                document.getElementById('branch_lon').value = e.latlng.lng.toFixed(6);
                updateCircle();
            } else {
                const cpIsPolygon = document.getElementById('cp_geofence_type').value === 'polygon';
                if (cpIsPolygon) return;
                setCheckpointCoordinates(e.latlng);
            }
        });

        // Geoman Shape drawing complete listener
        branchMap.on('pm:create', function(e) {
            const layer = e.layer;
            if (e.shape === 'Polygon' || e.shape === 'Rectangle') {
                const rawLatLngs = layer.getLatLngs();
                const latlngs = Array.isArray(rawLatLngs[0]) ? rawLatLngs[0] : rawLatLngs;
                const coordinates = latlngs.map(pt => [pt.lat, pt.lng]);
                
                // Close the polygon boundary
                if (coordinates.length > 0 && (coordinates[0][0] !== coordinates[coordinates.length-1][0] || coordinates[0][1] !== coordinates[coordinates.length-1][1])) {
                    coordinates.push(coordinates[0]);
                }
                const coordsStr = JSON.stringify(coordinates);
                
                // Centroid calculation
                let sumLat = 0, sumLng = 0;
                latlngs.forEach(pt => {
                    sumLat += pt.lat;
                    sumLng += pt.lng;
                });
                const centerLat = sumLat / latlngs.length;
                const centerLng = sumLng / latlngs.length;

                if (mapMode === 'primary') {
                    if (branchPolygon) branchMap.removeLayer(branchPolygon);
                    branchPolygon = layer;
                    document.getElementById('branch_polygon_coordinates').value = coordsStr;
                    document.getElementById('branch_lat').value = centerLat.toFixed(6);
                    document.getElementById('branch_lon').value = centerLng.toFixed(6);
                    
                    // Hide circle overlay
                    if (branchMarker && branchMap.hasLayer(branchMarker)) branchMap.removeLayer(branchMarker);
                    if (branchCircle && branchMap.hasLayer(branchCircle)) branchMap.removeLayer(branchCircle);
                } else {
                    if (tempCheckpointPolygon) branchMap.removeLayer(tempCheckpointPolygon);
                    tempCheckpointPolygon = layer;
                    document.getElementById('cp_polygon_coordinates').value = coordsStr;
                    document.getElementById('cp_lat').value = centerLat.toFixed(6);
                    document.getElementById('cp_lon').value = centerLng.toFixed(6);
                    
                    // Hide circle overlay
                    if (tempCheckpointMarker && branchMap.hasLayer(tempCheckpointMarker)) branchMap.removeLayer(tempCheckpointMarker);
                    if (tempCheckpointCircle && branchMap.hasLayer(tempCheckpointCircle)) branchMap.removeLayer(tempCheckpointCircle);
                }
            }
        });

        // Geoman removal listener
        branchMap.on('pm:remove', function(e) {
            const layer = e.layer;
            if (layer === branchPolygon) {
                branchPolygon = null;
                document.getElementById('branch_polygon_coordinates').value = '';
            } else if (layer === tempCheckpointPolygon) {
                tempCheckpointPolygon = null;
                document.getElementById('cp_polygon_coordinates').value = '';
            }
        });

        setTimeout(() => { branchMap.invalidateSize(); }, 100);
        branchMapInitialized = true;
    }

    function updateCircle() {
        const lat = parseFloat(document.getElementById('branch_lat').value) || -6.175392;
        const lon = parseFloat(document.getElementById('branch_lon').value) || 106.827153;
        const radius = parseFloat(document.getElementById('branch_rad').value) || 50;
        if (branchMarker) branchMarker.setLatLng([lat, lon]);
        if (branchCircle) {
            branchCircle.setLatLng([lat, lon]);
            branchCircle.setRadius(radius);
        }
        if (branchMap) branchMap.setView([lat, lon], branchMap.getZoom());
    }

    function onCoordChange() {
        const lat = parseFloat(document.getElementById('branch_lat').value);
        const lon = parseFloat(document.getElementById('branch_lon').value);
        if (!isNaN(lat) && !isNaN(lon) && branchMarker) {
            branchMarker.setLatLng([lat, lon]);
            if (branchCircle) branchCircle.setLatLng([lat, lon]);
            if (branchMap) branchMap.setView([lat, lon], branchMap.getZoom());
        }
    }

    function filterBranches() {
        const query = document.getElementById('branchSearch').value.toLowerCase().trim();
        const filter = document.getElementById('branchFilter').value;
        const coFilter = document.getElementById('branchCompanyFilter') ? document.getElementById('branchCompanyFilter').value : 'all';
        const tbody = document.getElementById('branchesTableBody');
        
        const branches = Array.isArray(currentBranches) ? currentBranches : [];

        const filtered = branches.filter(b => {
            const matchesSearch = !query || (b.name && b.name.toLowerCase().includes(query));
            const matchesFilter = filter === 'all'
                || (filter === 'active' && b.is_active)
                || (filter === 'inactive' && !b.is_active);
            const matchesCompany = coFilter === 'all' || String(b.company_id) === coFilter;
            return matchesSearch && matchesFilter && matchesCompany;
        });

        document.getElementById('branchCount').innerText = `${filtered.length} / ${branches.length} branches`;

        if (!filtered.length) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-sm text-slate-400 dark:text-slate-500">No matching branches.</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(b => `
            <tr class="${b.is_active ? 'hover:bg-slate-50 dark:hover:bg-slate-800/40' : 'opacity-60 hover:bg-slate-50 dark:hover:bg-slate-800/40'} transition-colors">
                <td class="px-5 py-4"><strong class="text-slate-800 dark:text-slate-100">${b.name}</strong></td>
                <td class="px-5 py-4">
                    ${b.company_name ? `
                        <button type="button" class="inline-flex items-center gap-1 rounded-full bg-indigo-50 px-2.5 py-0.5 text-xs font-semibold text-indigo-700 dark:bg-indigo-950/30 dark:text-indigo-400 border border-indigo-100 dark:border-indigo-900/50 hover:bg-indigo-100 dark:hover:bg-indigo-900/45 transition-colors cursor-pointer" onclick="quickFilterByCompany(${b.company_id})" title="Click to filter by ${b.company_name}">

    async function loadBranches() {
        try {
            await loadOnboardingReferenceData();
            const res = await fetch('/ui/branches');
            if (!res.ok) {
                const errText = await res.text();
                console.error('loadBranches failed:', res.status, errText);
                notify('Failed to load branches: server error', 'error');
                return;
            }
            const data = await res.json();
            if (!Array.isArray(data)) {
                console.error('loadBranches: response is not an array', data);
                notify('Failed to load branches: invalid data', 'error');
                return;
            }
            currentBranches = data;
            populateBranchCompanyFilter();
            filterBranches();
        } catch(e) {
            console.error('loadBranches error:', e);
            notify('Failed to load branches: ' + (e.message || 'network error'), 'error');
        }
    }

    let qrCodeInstance = null;

    function updateQrPreview() {
        const data = document.getElementById('branch_qr_data').value.trim();
        const container = document.getElementById('qrPreview');
        if (!container) return;
        
        container.innerHTML = '';
        
        if (!data) {
            container.innerHTML = '<span class="text-xs text-slate-400 text-center dark:text-slate-500">Live QR</span>';
            return;
        }
        
        try {
            qrCodeInstance = new QRCode(container, {
                text: data,
                width: 68,
                height: 68,
                colorDark: '#1e293b',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });
        } catch(e) {
            container.innerHTML = '<span class="text-xs text-red-500">Error</span>';
        }
    }

    async function editBranch(id) {
        sessionStorage.setItem('editing_branch_id', id);
        if (!Array.isArray(currentBranches) || currentBranches.length === 0) {
            await loadBranches();
        }
        if (!Array.isArray(currentBranches) || currentBranches.length === 0) {
            notify('No branch data available. Please reload the page.', 'error');
            return;
        }
        
        const branch = currentBranches.find(b => b.id === id);
        if (!branch) {
            notify('Branch not found in current data. Refreshing...', 'error');
            await loadBranches();
            const reloaded = currentBranches.find(b => b.id === id);
            if (!reloaded) {
                notify('Branch may have been deleted. Please refresh the page.', 'error');
                return;
            }
            return editBranch(id);
        }
        
        document.getElementById('edit_branch_id').value = branch.id;
        document.getElementById('checkpoint_branch_id').value = branch.id;
        document.getElementById('branch_name').value = branch.name;
        document.getElementById('branch_lat').value = branch.latitude;
        document.getElementById('branch_lon').value = branch.longitude;
        document.getElementById('branch_rad').value = branch.radius_meters;
        
        populateBranchFormDropdowns();
        document.getElementById('branch_company_id').value = branch.company_id || '';
        document.getElementById('branch_shift_schedule_id').value = branch.shift_schedule_id || '';
        document.getElementById('branch_timezone_offset').value = branch.timezone_offset !== null ? branch.timezone_offset : '7';
        document.getElementById('branch_timezone_name').value = branch.timezone_name || 'Asia/Jakarta';

        const gType = branch.geofence_type || 'circle';
        document.getElementById('branch_geofence_type').value = gType;
        document.getElementById('branch_polygon_coordinates').value = branch.polygon_coordinates || '';
        toggleGeofenceType(gType);

        document.getElementById('branch_qr_enabled').checked = branch.qr_code_enabled || false;
        document.getElementById('branch_qr_data').value = branch.qr_code_data || '';
        toggleQrField();
        updateQrPreview();
        document.getElementById('branch_nfc_enabled').checked = branch.nfc_enabled || false;
        document.getElementById('branch_nfc_data').value = branch.nfc_tag_data || '';
        toggleNfcField();
        updateNfcPreview();
        
        document.getElementById('cp_lat').value = branch.latitude;
        document.getElementById('cp_lon').value = branch.longitude;
        document.getElementById('cp_name').value = '';
        document.getElementById('cp_rad').value = 50;
        document.getElementById('cp_geofence_type').value = 'circle';
        document.getElementById('cp_polygon_coordinates').value = '';
        toggleCheckpointGeofenceType('circle');
        
        document.getElementById('checkpointNewBranchAlert').style.display = 'none';
        document.getElementById('checkpointContainer').style.display = 'block';
        loadCheckpoints(branch.id);
        
        document.getElementById('groupNewBranchAlert').style.display = 'none';
        document.getElementById('groupContainer').style.display = 'block';
        loadGroups(branch.id);

        document.getElementById('branchListSection').style.display = 'none';
        document.getElementById('branchFormSection').style.display = 'block';
        
        setTimeout(() => {
            initBranchMap();
            if (branchMap) {
                branchMap.invalidateSize();
                branchMap.setView([branch.latitude, branch.longitude], 15);
            }
            if (branchPolygon) {
                branchMap.removeLayer(branchPolygon);
                branchPolygon = null;
            }
            if (gType === 'polygon' && branch.polygon_coordinates) {
                try {
                    const coords = JSON.parse(branch.polygon_coordinates);
                    branchPolygon = L.polygon(coords, { color: '#6366f1', fillColor: '#6366f1', fillOpacity: 0.1, weight: 2 }).addTo(branchMap);
                    
                    if (branchMarker && branchMap.hasLayer(branchMarker)) branchMap.removeLayer(branchMarker);
                    if (branchCircle && branchMap.hasLayer(branchCircle)) branchMap.removeLayer(branchCircle);
                } catch(e) {
                    console.error('Error drawing loaded branch polygon:', e);
                }
            } else {
                if (branchMarker) {
                    branchMarker.setLatLng([branch.latitude, branch.longitude]).addTo(branchMap);
                }
                if (branchCircle) {
                    branchCircle.setLatLng([branch.latitude, branch.longitude]);
                    branchCircle.setRadius(branch.radius_meters).addTo(branchMap);
                }
            }
        }, 50);
        
        document.getElementById('branchFormTitle').innerText = '✏️ Edit Branch & Checkpoints';
        document.getElementById('saveBranchBtn').innerText = '💾 Update Branch';
    }

    async function saveBranch() {
        const qrEnabled = document.getElementById('branch_qr_enabled').checked;
        const nfcEnabled = document.getElementById('branch_nfc_enabled').checked;
        const gType = document.getElementById('branch_geofence_type').value || 'circle';
        const polyCoords = document.getElementById('branch_polygon_coordinates').value;
        
        const companyIdVal = document.getElementById('branch_company_id').value;
        const shiftIdVal = document.getElementById('branch_shift_schedule_id').value;
        const tzVal = document.getElementById('branch_timezone_offset').value;
        const tzNameVal = document.getElementById('branch_timezone_name').value;

        const payload = {
            name: document.getElementById('branch_name').value.trim(),
            latitude: parseFloat(document.getElementById('branch_lat').value),
            longitude: parseFloat(document.getElementById('branch_lon').value),
            radius_meters: parseFloat(document.getElementById('branch_rad').value) || 50,
            geofence_type: gType,
            polygon_coordinates: gType === 'polygon' ? polyCoords : null,
            qr_code_enabled: qrEnabled,
            qr_code_data: qrEnabled ? document.getElementById('branch_qr_data').value.trim() : null,
            nfc_enabled: nfcEnabled,
            nfc_tag_data: nfcEnabled ? document.getElementById('branch_nfc_data').value.trim() : null,
            company_id: companyIdVal ? parseInt(companyIdVal) : null,
            shift_schedule_id: shiftIdVal ? parseInt(shiftIdVal) : null,
            timezone_offset: tzVal ? parseInt(tzVal) : 7,
            timezone_name: tzNameVal || "Asia/Jakarta"
        };
        if (!payload.name || isNaN(payload.latitude) || isNaN(payload.longitude)) {
            notify('Please select location on map and enter branch name', 'error'); return;
        }
        if (gType === 'polygon' && !payload.polygon_coordinates) {
            notify('Please draw the geofence perimeter on the map', 'error'); return;
        }
        if (qrEnabled && !payload.qr_code_data) {
            notify('Please enter or generate QR code data', 'error'); return;
        }
        if (nfcEnabled && !payload.nfc_tag_data) {
            notify('Please enter or generate NFC tag data', 'error'); return;
        }
        
        const editId = document.getElementById('edit_branch_id').value;
        const url = editId ? `/ui/branches/${editId}` : '/ui/branches';
        const method = editId ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: method, headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            
            if (res.ok) {
                const resData = await res.json();
                notify(editId ? 'Branch updated successfully!' : 'Branch added successfully!');
                await loadBranches();
                if (!editId && resData && resData.id) {
                    editBranch(resData.id);
                } else {
                    cancelEdit();
                }
            } else {
                let errDetail = 'Failed to save branch';
                try {
                    const err = await res.json();
                    errDetail = err.detail || errDetail;
                } catch(_) {}
                notify(errDetail, 'error');
            }
        } catch(e) {
            notify('Network error while saving branch: ' + (e.message || 'unknown'), 'error');
        }
    }

    async function toggleBranchStatus(id, currentlyActive) {
        const label = currentlyActive ? 'deactivate' : 'activate';
        showConfirm(`Are you sure you want to <strong>${label}</strong> this branch?`, async () => {
            try {
                const res = await fetch(`/ui/branches/${id}/toggle`, {method: 'PATCH'});
                if (res.ok) {
                    notify(`Branch ${label}d`);
                    await loadBranches();
                } else {
                    let errDetail = 'Failed to toggle status';
                    try {
                        const err = await res.json();
                        errDetail = err.detail || errDetail;
                    } catch(_) {}
                    notify(errDetail, 'error');
                }
            } catch(e) {
                notify('Network error while toggling status: ' + (e.message || 'unknown'), 'error');
            }
        });
    }

    function confirmDeleteBranch(id, name) {
        showConfirm(
            `Delete branch <strong>${name}</strong>?<br><small class="text-slate-400 dark:text-slate-500">This cannot be undone. Remove all device assignments first before deleting.</small>`,
            async () => {
                try {
                    const res = await fetch(`/ui/branches/${id}`, {method: 'DELETE'});
                    if (res.ok) {
                        notify('Branch deleted');
                        await loadBranches();
                    } else {
                        let errDetail = 'Failed to delete branch';
                        try {
                            const err = await res.json();
                            errDetail = err.detail || errDetail;
                        } catch(_) {}
                        notify(errDetail, 'error');
                    }
                } catch(e) {
                    notify('Network error while deleting branch: ' + (e.message || 'unknown'), 'error');
                }
            }
        );
    }

    async function loadCheckpoints(branchId) {
        const tbody = document.getElementById('checkpointsTableBody');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-sm text-slate-400 dark:text-slate-500">⏳ Loading...</td></tr>';
        
        try {
            // Clear existing checkpoint layers from the map
            checkpointLayers.forEach(layer => {
                if (branchMap) branchMap.removeLayer(layer);
            });
            checkpointLayers = [];

            const res = await fetch(`/ui/branches/${branchId}/checkpoints`);
            if (!res.ok) throw new Error('Failed to load');
            const data = await res.json();
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-sm text-slate-400 dark:text-slate-500">No check-in checkpoints configured yet. This branch only uses the primary center coordinate.</td></tr>';
                const badge = document.getElementById('checkpointCountBadge');
                if (badge) badge.innerText = '0 Points';
                return;
            }
            const badge = document.getElementById('checkpointCountBadge');
            if (badge) badge.innerText = `${data.length} Point${data.length === 1 ? '' : 's'}`;
            
            // Draw checkpoint layers on Leaflet map
            if (branchMap && Array.isArray(data)) {
                data.forEach(cp => {
                    const cpColor = cp.is_active ? '#10b981' : '#f59e0b';
                    
                    if (cp.geofence_type === 'polygon' && cp.polygon_coordinates) {
                        try {
                            const coords = JSON.parse(cp.polygon_coordinates);
                            const polygonLayer = L.polygon(coords, {
                                color: cpColor,
                                fillColor: cpColor,
                                fillOpacity: 0.15,
                                weight: 2,
                                title: cp.name
                            }).addTo(branchMap);
                            
                            polygonLayer.bindPopup(`<b>Checkpoint (Polygon): ${cp.name}</b><br>Status: ${cp.is_active ? 'Active' : 'Inactive'}`);
                            checkpointLayers.push(polygonLayer);
                        } catch(e) {
                            console.error('Error drawing checkpoint polygon:', e);
                        }
                    } else {
                        const circle = L.circle([cp.latitude, cp.longitude], {
                            radius: cp.radius_meters || 50,
                            color: cpColor,
                            fillColor: cpColor,
                            fillOpacity: 0.15,
                            weight: 2
                        }).addTo(branchMap);
                        
                        const marker = L.marker([cp.latitude, cp.longitude], {
                            draggable: true,
                            title: cp.name
                        }).addTo(branchMap);
                        
                        marker.bindPopup(`<b>Checkpoint: ${cp.name}</b><br>Radius: ${cp.radius_meters}m<br>Status: ${cp.is_active ? 'Active' : 'Inactive'}<br><small class="text-slate-400 dark:text-slate-500">Drag to relocate and click 'Add Point' to update.</small>`);
                        
                        marker.on('dragend', function() {
                            const pos = marker.getLatLng();
                            document.getElementById('cp_lat').value = pos.lat.toFixed(6);
                            document.getElementById('cp_lon').value = pos.lng.toFixed(6);
                            document.getElementById('cp_name').value = cp.name;
                            document.getElementById('cp_rad').value = cp.radius_meters || 50;
                            circle.setLatLng(pos);
                            notify(`Relocated checkpoint "${cp.name}". Click "Add Point" to save.`);
                        });
                        
                        checkpointLayers.push(circle);
                        checkpointLayers.push(marker);
                    }
                });
            }

            tbody.innerHTML = data.map(cp => `
                <tr class="${cp.is_active ? 'hover:bg-slate-50 dark:hover:bg-slate-800/40' : 'opacity-60 hover:bg-slate-50 dark:hover:bg-slate-800/40'} transition-colors">
                    <td class="px-3 py-2.5 text-sm font-semibold text-slate-800 dark:text-slate-100">${cp.name}</td>
                    <td class="px-3 py-2.5 font-mono text-xs text-slate-500 dark:text-slate-400">
                        ${cp.latitude !== null && cp.latitude !== undefined ? cp.latitude.toFixed(5) : '0.00000'}, 
                        ${cp.longitude !== null && cp.longitude !== undefined ? cp.longitude.toFixed(5) : '0.00000'}
                    </td>
                    <td class="px-3 py-2.5 text-sm text-center text-slate-700 dark:text-slate-300">${cp.geofence_type === 'polygon' ? '⬡ Polygon' : cp.radius_meters + 'm'}</td>
                    <td class="px-3 py-2.5 text-center">
                        <label class="cursor-pointer" onclick="toggleCheckpointStatus(${branchId}, ${cp.id}, ${cp.is_active})">
                            <span class="toggle-slider ${cp.is_active ? 'active' : 'inactive'}" style="width:32px;height:16px;"></span>
                        </label>
                    </td>
                    <td class="px-3 py-2.5 text-right">
                        <button class="inline-flex items-center gap-1 rounded-lg border border-red-300 bg-red-50 px-2 py-1 text-xs font-semibold text-red-700 hover:bg-red-100 transition-colors dark:border-red-900/50 dark:bg-red-950/30 dark:text-red-400 dark:hover:bg-red-900/30" onclick="deleteCheckpoint(${branchId}, ${cp.id})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-sm text-red-500">Failed to load checkpoints.</td></tr>';
        }
    }

    async function submitAddCheckpoint() {
        const branchId = document.getElementById('checkpoint_branch_id').value;
        const cpGType = document.getElementById('cp_geofence_type').value || 'circle';
        const cpPolyCoords = document.getElementById('cp_polygon_coordinates').value;
        
        const payload = {
            name: document.getElementById('cp_name').value.trim(),
            latitude: parseFloat(document.getElementById('cp_lat').value),
            longitude: parseFloat(document.getElementById('cp_lon').value),
            radius_meters: parseFloat(document.getElementById('cp_rad').value) || 50,
            geofence_type: cpGType,
            polygon_coordinates: cpGType === 'polygon' ? cpPolyCoords : null
        };
        
        if (!payload.name || isNaN(payload.latitude) || isNaN(payload.longitude)) {
            notify('Please specify checkpoint coordinates and point name', 'error');
            return;
        }
        if (cpGType === 'polygon' && !payload.polygon_coordinates) {
            notify('Please draw checkpoint polygon geofence on map', 'error');
            return;
        }
        
        try {
            const res = await fetch(`/ui/branches/${branchId}/checkpoints`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            
            if (res.ok) {
                notify('Checkpoint added successfully!');
                document.getElementById('cp_name').value = '';
                document.getElementById('cp_lat').value = '';
                document.getElementById('cp_lon').value = '';
                document.getElementById('cp_rad').value = 50;
                document.getElementById('cp_geofence_type').value = 'circle';
                document.getElementById('cp_polygon_coordinates').value = '';
                toggleCheckpointGeofenceType('circle');
                
                if (tempCheckpointMarker) {
                    if (branchMap) branchMap.removeLayer(tempCheckpointMarker);
                    tempCheckpointMarker = null;
                }
                if (tempCheckpointCircle) {
                    if (branchMap) branchMap.removeLayer(tempCheckpointCircle);
                    tempCheckpointCircle = null;
                }
                if (tempCheckpointPolygon) {
                    if (branchMap) branchMap.removeLayer(tempCheckpointPolygon);
                    tempCheckpointPolygon = null;
                }
                loadCheckpoints(branchId);
            } else {
                let errDetail = 'Failed to add checkpoint';
                try {
                    const err = await res.json();
                    errDetail = err.detail || errDetail;
                } catch(_) {}
                notify(errDetail, 'error');
            }
        } catch(e) {
            notify('Network error adding checkpoint: ' + (e.message || 'unknown'), 'error');
        }
    }

    async function toggleCheckpointStatus(branchId, checkpointId, currentlyActive) {
        try {
            const res = await fetch(`/ui/branches/${branchId}/checkpoints/${checkpointId}/toggle`, {method: 'PATCH'});
            if (res.ok) {
                notify(currentlyActive ? 'Checkpoint deactivated' : 'Checkpoint activated');
                loadCheckpoints(branchId);
            } else {
                notify('Failed to toggle checkpoint status', 'error');
            }
        } catch(e) {
            notify('Network error: ' + (e.message || 'unknown'), 'error');
        }
    }

    async function deleteCheckpoint(branchId, checkpointId) {
        showConfirm('Are you sure you want to delete this checkpoint?', async () => {
            try {
                const res = await fetch(`/ui/branches/${branchId}/checkpoints/${checkpointId}`, {method: 'DELETE'});
                if (res.ok) {
                    notify('Checkpoint deleted');
                    loadCheckpoints(branchId);
                } else {
                    notify('Failed to delete checkpoint', 'error');
                }
            } catch(e) {
                notify('Network error: ' + (e.message || 'unknown'), 'error');
            }
        });
    }

    // ── API Keys ───────────────────────────────────────────────────────────────
    let _generatedKey = '';

    function expiryBadgeHtml(k) {
        if (!k.expires_at) return '<span class="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-semibold text-slate-500 dark:bg-slate-800 dark:text-slate-400">Never</span>';
        if (k.expiry_status === 'expired') {
            return '<span class="inline-flex items-center rounded-full bg-red-50 px-2.5 py-0.5 text-xs font-semibold text-red-700 dark:bg-red-950/30 dark:text-red-400">⛔ Expired</span>';
        }
        if (k.expiry_status === 'expiring_soon') {
            const days = k.expires_in_days;
            const label = days === 0 ? 'Expires today' : days < 0 ? 'Expired' : `Expires in ${days}d`;
            return `<span class="inline-flex items-center rounded-full bg-amber-50 px-2.5 py-0.5 text-xs font-semibold text-amber-700 dark:bg-amber-950/30 dark:text-amber-400">⚠️ ${label}</span>`;
        }
        return `<span class="inline-flex items-center rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 dark:bg-emerald-950/30 dark:text-emerald-400">✅ ${k.expires_in_days}d</span>`;
    }

    async function loadApiKeys() {
        const res = await fetch('/ui/api-keys');
        const keys = await res.json();
        const tbody = document.getElementById('keysTableBody');
        if (!keys.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-sm text-slate-400 dark:text-slate-500">No API keys yet. Generate one above.</td></tr>';
            return;
        }
        tbody.innerHTML = keys.map(k => {
            const lastUsed = k.last_used_at
                ? new Date(k.last_used_at).toLocaleString(undefined, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})
                : 'Never';
            const lastIp = k.last_used_ip || '—';
            const actions = [];
            if (k.is_active && k.expiry_status !== 'expired') {
                actions.push(`<button class="inline-flex items-center gap-1 rounded-lg border border-indigo-300 bg-indigo-50 px-3 py-1.5 text-xs font-semibold text-indigo-700 hover:bg-indigo-100 transition-colors dark:border-indigo-800 dark:bg-indigo-950/30 dark:text-indigo-400" onclick="rotateKey(${k.id})" title="Rotate key (grace period)">🔄 Rotate</button>`);
                actions.push(`<button class="inline-flex items-center gap-1 rounded-lg border border-red-300 bg-red-50 px-3 py-1.5 text-xs font-semibold text-red-700 hover:bg-red-100 transition-colors ml-1 dark:border-red-900/50 dark:bg-red-950/30 dark:text-red-400 dark:hover:bg-red-900/30" onclick="revokeKey(${k.id})" title="Revoke">Revoke</button>`);
            } else {
                actions.push(`<button class="inline-flex items-center gap-1 rounded-lg bg-red-500 border border-red-500 px-3 py-1.5 text-xs font-semibold text-white hover:bg-red-600 transition-colors ml-1" onclick="deleteKey(${k.id})" title="Permanently delete">Delete</button>`);
            }
            actions.push(`<button class="inline-flex items-center gap-1 rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors ml-1 dark:border-slate-700 dark:text-slate-400 dark:hover:bg-slate-800/40" onclick="renameKey(${k.id},'${k.label.replace(/'/g,"\\'")}')" title="Rename">✏️</button>`);
            return `
            <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors dark:hover:bg-slate-800/40">
                <td class="px-5 py-4"><strong class="text-slate-800 dark:text-slate-100">${k.label}</strong></td>
                <td class="px-5 py-4 font-mono text-sm text-indigo-600 dark:text-indigo-400">${k.key_preview}</td>
                <td class="px-5 py-4">
                    ${k.is_active && k.expiry_status !== 'expired'
                        ? '<span class="inline-flex items-center rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 dark:bg-emerald-950/30 dark:text-emerald-400">Active</span>'
                        : '<span class="inline-flex items-center rounded-full bg-red-50 px-2.5 py-0.5 text-xs font-semibold text-red-700 dark:bg-red-950/30 dark:text-red-400">Revoked</span>'}
                </td>
                <td class="px-5 py-4">${expiryBadgeHtml(k)}</td>
                <td class="px-5 py-4 text-center text-sm text-slate-700 dark:text-slate-300">${k.device_count ?? 0}</td>
                <td class="px-5 py-4 text-sm text-slate-400 dark:text-slate-500">${lastUsed}</td>
                <td class="px-5 py-4 text-xs font-mono text-slate-400 dark:text-slate-500">${lastIp}</td>
                <td class="px-5 py-4 text-right whitespace-nowrap">${actions.join('')}</td>
            </tr>`;
        }).join('');
    }

        const data = await res.json();
