        document.getElementById('newKeyValue').innerText = data.key;
        document.getElementById('keyGenerateForm').style.display = 'none';

    async function saveApiKeyRename() {
        const id = document.getElementById('edit_key_id').value;
        const label = document.getElementById('edit_key_label').value.trim();
        if (!label) return;
        
        const res = await fetch(`/ui/api-keys/${id}?label=${encodeURIComponent(label)}`, {method: 'PUT'});
        const data = await res.json();
        if (res.ok) {
            closeApiKeyEditModal();
            await loadApiKeys();
            notify('Key renamed successfully');
        } else {
            notify(data.detail || 'Failed to rename', 'error');
        }
    }

    async function renameKey(id, currentLabel) {
        openApiKeyEditModal(id, currentLabel);
    }

    async function revokeKey(id) {
        if (!confirm('Revoke this API key? All mobile apps using it will be blocked immediately.')) return;
        await fetch(`/ui/api-keys/${id}`, {method: 'DELETE'});
        await loadApiKeys();
        notify('Key revoked. Devices using this key will stop working.');
    }

    async function deleteKey(id) {
        if (!confirm('Permanently delete this revoked key? This action cannot be undone.\n\nNote: Keys with bound devices cannot be deleted — revoke them instead.')) return;
        const res = await fetch(`/ui/api-keys/${id}?hard=true`, {method: 'DELETE'});
        const data = await res.json();
        if (res.ok) { await loadApiKeys(); notify('Key permanently deleted'); }
        else notify(data.detail || 'Delete failed', 'error');
    }

    async function rotateKey(id) {
        if (!confirm('Rotate this API key?\n\nA new key will be generated with the same label. The old key will remain valid for 7 more days (grace period) to allow mobile apps to transition smoothly.\n\nYou will need to update the mobile app with the new key.')) return;
        const res = await fetch(`/ui/api-keys/${id}/rotate`, {method: 'POST'});
        const data = await res.json();
        if (res.ok) {
            _generatedKey = data.new_key;
            document.getElementById('newKeyValue').innerText = data.new_key;
            document.getElementById('newKeyDisplay').style.display = 'block';
            await loadApiKeys();
            notify(`Key rotated! Old key expires ${new Date(data.old_key_expires_at).toLocaleDateString()}. New key shown above.`);
        } else {
            const err = await res.json();
            notify(err.detail || 'Rotate failed', 'error');
        }
    }

    async function savePunchType() {
        const editId = document.getElementById('edit_pt_id').value;
        const payload = {
            code: document.getElementById('pt_code').value.trim(),
            label: document.getElementById('pt_label').value.trim(),
            adms_status_code: document.getElementById('pt_adms_code').value.trim(),
            icon: document.getElementById('pt_icon').value.trim(),
            color_hex: document.getElementById('pt_color').value,
            display_order: parseInt(document.getElementById('pt_order').value),
            requires_geofence: document.getElementById('pt_requires_geo').checked,
            is_active: true
        };

        if (!payload.code || !payload.label) {
            notify('Code and Label are required', 'error'); return;
        }

        const url = editId ? `/ui/punch-types/${editId}` : '/ui/punch-types';
        const method = editId ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method: method, headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            notify(editId ? 'Punch Type updated!' : 'Punch Type created!');
            cancelPtEdit();
            await loadPunchTypes();
        } else {
            const err = await res.json();
            notify(err.detail || 'Failed to save punch type', 'error');
        }
    }

    async function deletePunchType(code) {
        if (!confirm(`Are you sure you want to delete Punch Type '${code}'?`)) return;
        const res = await fetch(`/ui/punch-types/${code}`, {method: 'DELETE'});
        if (res.ok) { notify('Punch Type deleted'); await loadPunchTypes(); }
        else { const err = await res.json(); notify(err.detail || 'Failed to delete', 'error'); }
    }

    function editUser(id) {
        const user = currentUsers.find(u => u.id === id);
        if (!user) return;
        
        document.getElementById('edit_user_id').value = user.id;
        document.getElementById('new_user_name').value = user.username;
        document.getElementById('new_user_pwd').value = '';
        document.getElementById('new_user_pwd').placeholder = 'Keep blank to stay same';
        document.getElementById('new_user_role').value = user.role || 'admin';
        
        if (user.username === 'admin') {
            document.getElementById('new_user_role').parentElement.style.display = 'none';
        } else {
            document.getElementById('new_user_role').parentElement.style.display = 'block';
        }

        document.getElementById('newUserForm').reset();
        document.getElementById('new_user_pwd').placeholder = '••••••••';
        document.getElementById('new_user_role').parentElement.style.display = 'block';

        document.getElementById('saveUserBtn').innerText = 'Add';

    async function saveUser() {
        const userId = document.getElementById('edit_user_id').value;
        const payload = {
            username: document.getElementById('new_user_name').value.trim(),
            password: document.getElementById('new_user_pwd').value || null,
            role: document.getElementById('new_user_role').value
        };

        if (!payload.username) {
            notify('Username is required', 'error'); return;
        }
        if (!userId && (!payload.password || payload.password.length < 5)) {
            notify('Password is required and must be >= 5 chars', 'error'); return;
        }

        const url = userId ? `/ui/users/${userId}` : '/ui/users';
        const method = userId ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method: method, headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            notify(userId ? 'User updated!' : 'User created!');
            cancelUserEdit();
            await loadUsers();
        } else {
            const err = await res.json();
            notify(err.detail || 'Failed to save user', 'error');
        }
    }

    async function deleteUser(id) {
        if (!confirm('Are you sure you want to delete this admin account?')) return;
        const res = await fetch(`/ui/users/${id}`, {method: 'DELETE'});
        if (res.ok) { notify('User deleted'); await loadUsers(); }
        else { const err = await res.json(); notify(err.detail || 'Failed to delete', 'error'); }
    }

    async function generateOnboardQR() {
        const empId = document.getElementById('onboard_emp_id').value;
        const branchId = document.getElementById('onboard_branch_id').value;
        const keyLabel = document.getElementById('onboard_key_label').value.trim();
        
        if (!empId || !branchId || !keyLabel) {
            notify('Please fill in all required fields', 'error');
            return;
        }
        
        try {
            const response = await fetch('/api/v1/admin/generate-onboard-qr', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    employee_id: empId,
                    branch_id: parseInt(branchId),
                    key_label: keyLabel
                })
            });
            if (!response.ok) throw new Error('Failed to generate QR');
            
            const data = await response.json();
            
            const qrData = encodeURIComponent(JSON.stringify(data));
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${qrData}`;

            document.getElementById('onboardQrImg').src = qrUrl;
            document.getElementById('onboardQrContainer').style.display = 'block';
            
            if (data.api_key) {
                notify(`QR generated! API Key: ${data.api_key.substring(0, 20)}...`);
            }
        } catch(err) {
            notify(err.message || 'Failed to generate QR');
        }
    }

        const companyIdVal = document.getElementById('emp_company_id').value;
        const companyId = companyIdVal ? parseInt(companyIdVal) : null;
        const groupSelect = document.getElementById('emp_group_id');
        groupSelect.innerHTML = '<option value="">No Group assigned</option>';

        if (!companyId) {
            _allGroups.forEach(g => {
                groupSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`;
            });
            return;
        }

        fetch(`/ui/companies/${companyId}/branches`)
            .then(res => res.json())
            .then(branches => {
                const branchIds = new Set(branches.map(b => b.id));
                const filteredGroups = _allGroups.filter(g => branchIds.has(g.branch_id));
                filteredGroups.forEach(g => {
                    groupSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`;
                });

            .catch(err => console.error("Error loading branches for company filtering", err));

    // ── Branch Shift Groups Management JS ──
    async function loadGroups(branchId) {
        const tbody = document.getElementById('groupsTableBody');
        if (!tbody) return;
        tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4">Loading groups...</td></tr>';
        
        try {
            const res = await fetch(`/ui/branches/${branchId}/groups`);
            if (!res.ok) throw new Error("Failed to fetch groups");
            const groups = await res.json();
            
            document.getElementById('groupCountBadge').innerText = `${groups.length} Groups`;
            
            if (groups.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-slate-400">No shift groups defined in this branch.</td></tr>';
                return;
            }
            
            tbody.innerHTML = groups.map(g => {
                const shift = _allShiftSchedules.find(s => s.id === g.shift_schedule_id);
                const shiftName = shift ? `${shift.name} (${shift.start_time}-${shift.end_time})` : 'Branch Default';
                return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40">
                        <td class="px-3 py-2 font-semibold text-slate-800 dark:text-slate-200">${g.name}</td>
                        <td class="px-3 py-2 text-slate-500 dark:text-slate-400">${shiftName}</td>
                        <td class="px-3 py-2 text-right">
                            <button type="button" class="text-red-500 hover:text-red-750 font-bold bg-transparent border-0 cursor-pointer text-sm" onclick="deleteGroup(${g.id}, ${branchId})">🗑️</button>
                        </td>
                    </tr>
                `;
            }).join('');
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-red-500">Failed to load groups.</td></tr>';
        }
    }

    async function submitAddGroup() {
        const branchId = document.getElementById('edit_branch_id').value;
        const name = document.getElementById('grp_name').value.trim();
        const shiftIdVal = document.getElementById('grp_shift_schedule_id').value;
        
        if (!branchId || !name) return;
        
        const payload = {
            name: name,
            branch_id: parseInt(branchId),
            shift_schedule_id: shiftIdVal ? parseInt(shiftIdVal) : null
        };
        
        try {
            const res = await fetch('/ui/employee-groups', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                notify("Shift Group added successfully!");
                document.getElementById('grp_name').value = '';
                document.getElementById('grp_shift_schedule_id').value = '';
                await loadOnboardingReferenceData();
                await loadGroups(branchId);
            } else {
                const err = await res.json();
                notify(err.detail || "Failed to add group", "error");
            }
        } catch(e) {
            notify("Network error adding group", "error");
        }
    }

    async function saveEmployee(event) {
        event.preventDefault();
        const mode = document.getElementById('emp_mode').value;
        const pin = document.getElementById('emp_pin').value.trim();
        const name = document.getElementById('emp_name').value.trim();
        const dept = document.getElementById('emp_dept').value.trim() || null;
        const active = document.getElementById('emp_active').checked;
        
        const type = document.getElementById('emp_type').value;
        const companyIdVal = document.getElementById('emp_company_id').value;
        const groupIdVal = document.getElementById('emp_group_id').value;
        const shiftIdVal = document.getElementById('emp_shift_schedule_id').value;

        if (!pin || !name) {
            notify('Please fill out PIN and Full Name.', 'error');
            return;
        }

        const payload = {
            employee_id: pin,
            full_name: name,
            department: dept,
            is_active: active,
            employee_type: type,
            company_id: companyIdVal ? parseInt(companyIdVal) : null,
            group_id: groupIdVal ? parseInt(groupIdVal) : null,
            shift_schedule_id: shiftIdVal ? parseInt(shiftIdVal) : null
        };

        const saveBtn = document.getElementById('saveEmployeeBtn');
        saveBtn.disabled = true;
        saveBtn.innerText = 'Saving...';

        try {
            const url = mode === 'create' ? '/ui/employees' : `/ui/employees/${pin}`;
            const method = mode === 'create' ? 'POST' : 'PUT';

            const res = await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (res.ok) {
                notify(mode === 'create' ? 'Employee created successfully!' : 'Employee updated successfully!');
                closeEmployeeModal();
                await loadEmployees();
            } else {
                notify(data.detail || 'Failed to save employee', 'error');
            }
        } catch(e) {
            notify('Network error saving employee', 'error');
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerText = mode === 'create' ? 'Add Employee' : 'Save Changes';
        }
    }

    async function toggleEmployeeActiveStatus(pin, currentlyActive) {
        const payload = { is_active: !currentlyActive };
        try {
            const res = await fetch(`/ui/employees/${pin}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                notify(!currentlyActive ? 'Employee activated' : 'Employee deactivated');
                await loadEmployees();
            } else {
                notify('Failed to update employee status', 'error');
            }
        } catch(e) {
            notify('Network error updating status', 'error');
        }
    }

    async function syncEmployeeToAdms(pin, name) {
        notify(`Triggering ADMS registration for ${name}...`, 'info');
        try {
            const res = await fetch(`/ui/employees/${pin}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ full_name: name })
            });

            if (res.ok) {
                notify(`ADMS sync triggered in background for ${name}. Wait a moment.`);
                setTimeout(loadEmployees, 3000);
            } else {
                notify('Failed to trigger sync', 'error');
            }
        } catch(e) {
            notify('Network error triggering sync', 'error');
        }
    }

    async function clearEmployeeFromAdms(pin) {
        showConfirm(`Are you sure you want to delete employee <b>${pin}</b> from the ADMS server? This keeps them in the local database but removes them from the device command database on the ADMS server.`, async () => {
            notify(`Clearing employee ${pin} from ADMS...`, 'info');
            try {
                const res = await fetch(`/ui/employees/${pin}/delete-from-adms`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    notify(`Successfully sent delete command to ADMS!`);
                    await loadEmployees();
                } else {
                    notify(data.detail || 'Clear from ADMS failed', 'error');
                }
            } catch(e) {
                notify('Network error clearing from ADMS', 'error');
            }
        });
    }

    async function deleteEmployee(pin) {
        showConfirm(`Are you sure you want to delete employee <b>${pin}</b>?<br><br><span class="text-red-500 font-semibold">⚠️ Warning:</span> This will:<br>1. Soft-delete them locally (hiding them from active lists).<br>2. Cascade delete all their mobile app <b>Device Bindings</b> (instantly revoking their app login).<br>3. Remove their supervisor mappings.<br><br><i>Note: Their record is left intact in ADMS for payroll, and historical clock-ins are preserved.</i>`, async () => {
            try {
                const res = await fetch(`/ui/employees/${pin}`, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok) {
                    notify(`Employee ${pin} soft-deleted. Mobile app access revoked!`);
                    await loadEmployees();
                } else {
                    notify(data.detail || 'Failed to delete employee', 'error');
                }
            } catch(e) {
                notify('Network error deleting employee', 'error');
            }
        });
    }

    function generateCyclicDaysCheckboxes(selectedDays = []) {
        const cyclicDaysGrid = document.getElementById('cyclicDaysGrid');
        const intervalInput = document.getElementById('shift_interval_days');
        const interval = parseInt(intervalInput.value);

        if (isNaN(interval) || interval <= 1) {
            cyclicDaysGrid.innerHTML = '<p class="text-sm text-slate-400 italic">Enter a valid cycle length (2+ days) above to select days.</p>';
            return;
        }

        const maxDays = Math.min(interval, 31); // Cap visual display to avoid rendering performance issues
        let html = '';
        for (let i = 1; i <= maxDays; i++) {
            const checked = selectedDays.includes(i) ? 'checked' : '';
            html += `
                <label class="inline-flex items-center gap-2 cursor-pointer rounded-lg border border-slate-200 bg-white px-3.5 py-2 hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-900 dark:hover:bg-slate-800/40 text-sm font-semibold text-slate-700 dark:text-slate-300 transition-all select-none">
                    <input type="checkbox" name="cyclic_day" value="${i}" ${checked} class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-4 w-4 dark:border-slate-700 dark:text-indigo-400">
                    Day ${i}
                </label>
            `;
        }
        cyclicDaysGrid.innerHTML = html;
    }

    async function editShiftSchedule(id) {
        const s = _allShiftSchedules.find(x => x.id === id);
        if (!s) return;

        const container = document.getElementById('shiftFormContainer');
        container.classList.remove('hidden');
        document.getElementById('shiftFormTitle').innerText = `✏️ Edit Shift: ${s.name}`;
        
        document.getElementById('edit_shift_id').value = s.id;
        document.getElementById('shift_name').value = s.name;
        document.getElementById('shift_start_time').value = s.start_time;
        document.getElementById('shift_end_time').value = s.end_time;
        document.getElementById('shift_grace_minutes').value = s.grace_minutes;
        document.getElementById('shift_min_work_hours').value = s.min_work_hours;
        document.getElementById('shift_overtime_after_hours').value = s.overtime_after_hours;
        document.getElementById('shift_is_default').checked = s.is_default;
        
        document.getElementById('shift_overtime_multiplier_1').value = s.overtime_multiplier_1 !== undefined ? s.overtime_multiplier_1 : 1.5;
        document.getElementById('shift_overtime_multiplier_2').value = s.overtime_multiplier_2 !== undefined ? s.overtime_multiplier_2 : 2.0;
        document.getElementById('shift_overtime_threshold_2_hours').value = s.overtime_threshold_2_hours !== null && s.overtime_threshold_2_hours !== undefined ? s.overtime_threshold_2_hours : '';
        document.getElementById('shift_weekend_overtime_multiplier').value = s.weekend_overtime_multiplier !== undefined ? s.weekend_overtime_multiplier : 2.0;
        document.getElementById('shift_holiday_overtime_multiplier').value = s.holiday_overtime_multiplier !== undefined ? s.holiday_overtime_multiplier : 3.0;
        document.getElementById('shift_monthly_overtime_cap_hours').value = s.monthly_overtime_cap_hours !== null && s.monthly_overtime_cap_hours !== undefined ? s.monthly_overtime_cap_hours : '';
        document.getElementById('shift_auto_clockout_enabled').checked = !!s.auto_clockout_enabled;
        document.getElementById('shift_auto_clockout_buffer_minutes').value = s.auto_clockout_buffer_minutes !== undefined && s.auto_clockout_buffer_minutes !== null ? s.auto_clockout_buffer_minutes : 60;
        
        const type = s.schedule_type || 'weekly';
        document.getElementById('shift_schedule_type').value = type;
        
        toggleScheduleTypeInputs();

        const workingDays = s.working_days.split(',').map(d => parseInt(d.trim())).filter(d => !isNaN(d));

        if (type === 'cyclic') {
            document.getElementById('shift_interval_days').value = s.interval_days || '';
            const anchorDateVal = s.anchor_date ? s.anchor_date.split('T')[0] : '';
            document.getElementById('shift_anchor_date').value = anchorDateVal;
            generateCyclicDaysCheckboxes(workingDays);
        } else {
            // Uncheck weekly checkboxes first
            document.querySelectorAll('input[name="weekly_day"]').forEach(cb => {
                cb.checked = workingDays.includes(parseInt(cb.value));
            });
        }

        container.scrollIntoView({ behavior: 'smooth' });
    }

    async function saveShiftSchedule() {
        const id = document.getElementById('edit_shift_id').value;
        const name = document.getElementById('shift_name').value;
        const type = document.getElementById('shift_schedule_type').value;
        const startTime = document.getElementById('shift_start_time').value;
        const endTime = document.getElementById('shift_end_time').value;
        const graceMinutes = parseInt(document.getElementById('shift_grace_minutes').value);
        const minWorkHours = parseFloat(document.getElementById('shift_min_work_hours').value);
        const overtimeAfterHours = parseFloat(document.getElementById('shift_overtime_after_hours').value);
        const isDefault = document.getElementById('shift_is_default').checked;

        let workingDays = '';
        let intervalDays = null;
        let anchorDate = null;

        if (type === 'cyclic') {
            intervalDays = parseInt(document.getElementById('shift_interval_days').value);
            anchorDate = document.getElementById('shift_anchor_date').value;

            if (isNaN(intervalDays) || intervalDays <= 1) {
                notify('Please provide a valid cycle length of 2 or more days.', 'error');
                return;
            }
            if (!anchorDate) {
                notify('Please select a cycle start / anchor date.', 'error');
                return;
            }

            const checkedDays = Array.from(document.querySelectorAll('input[name="cyclic_day"]:checked')).map(cb => cb.value);
            if (!checkedDays.length) {
                notify('Please select at least one working day in the cycle.', 'error');
                return;
            }
            workingDays = checkedDays.join(',');
        } else {
            const checkedDays = Array.from(document.querySelectorAll('input[name="weekly_day"]:checked')).map(cb => cb.value);
            if (!checkedDays.length) {
                notify('Please select at least one weekly working day.', 'error');
                return;
            }
            workingDays = checkedDays.join(',');
        }

        const overtimeMultiplier1 = parseFloat(document.getElementById('shift_overtime_multiplier_1').value || 1.5);
        const overtimeMultiplier2 = parseFloat(document.getElementById('shift_overtime_multiplier_2').value || 2.0);
        const otThreshold2Val = document.getElementById('shift_overtime_threshold_2_hours').value;
        const overtimeThreshold2Hours = otThreshold2Val !== '' ? parseFloat(otThreshold2Val) : null;
        const weekendOvertimeMultiplier = parseFloat(document.getElementById('shift_weekend_overtime_multiplier').value || 2.0);
        const holidayOvertimeMultiplier = parseFloat(document.getElementById('shift_holiday_overtime_multiplier').value || 3.0);
        const otCapVal = document.getElementById('shift_monthly_overtime_cap_hours').value;
        const monthlyOvertimeCapHours = otCapVal !== '' ? parseFloat(otCapVal) : null;
        const autoClockoutEnabled = document.getElementById('shift_auto_clockout_enabled').checked;
        const autoClockoutBufferMinutes = parseInt(document.getElementById('shift_auto_clockout_buffer_minutes').value || 60);

        const payload = {
            name,
            start_time: startTime,
            end_time: endTime,
            grace_minutes: graceMinutes,
            min_work_hours: minWorkHours,
            overtime_after_hours: overtimeAfterHours,
            is_default: isDefault,
            working_days: workingDays,
            schedule_type: type,
            interval_days: intervalDays,
            anchor_date: anchorDate || null,
            overtime_multiplier_1: overtimeMultiplier1,
            overtime_multiplier_2: overtimeMultiplier2,
            overtime_threshold_2_hours: overtimeThreshold2Hours,
            weekend_overtime_multiplier: weekendOvertimeMultiplier,
            holiday_overtime_multiplier: holidayOvertimeMultiplier,
            monthly_overtime_cap_hours: monthlyOvertimeCapHours,
            auto_clockout_enabled: autoClockoutEnabled,
            auto_clockout_buffer_minutes: autoClockoutBufferMinutes
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/ui/shift-schedules/${id}` : '/ui/shift-schedules';

        try {
            const res = await fetch(url, {
                method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                notify(id ? 'Shift schedule updated successfully!' : 'Shift schedule created successfully!');
                hideShiftForm();
                await loadShiftSchedules();
            } else {
                const data = await res.json();
                notify(data.detail || 'Failed to save shift schedule', 'error');
            }
        } catch(e) {
            notify('Network error saving shift schedule', 'error');
        }
    }

    async function editCompanyDetails(id) {

        container.classList.remove('hidden');

    async function saveCompanyDetails() {
        const id = document.getElementById('edit_company_id').value;
        const name = document.getElementById('company_name').value.trim();
        const code = document.getElementById('company_code').value.toUpperCase().trim();
        const shiftIdVal = document.getElementById('company_shift_schedule_id').value;
        const isActive = document.getElementById('company_is_active').checked;

        if (!name || !code) {
            notify('Please fill in both Company Name and Unique Code.', 'error');
            return;
        }

        const payload = {
            name,
            code,
            shift_schedule_id: shiftIdVal ? parseInt(shiftIdVal) : null,
            is_active: isActive
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/ui/companies/${id}` : '/ui/companies';

        try {
            const res = await fetch(url, {
                method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                notify(id ? 'Company details updated successfully!' : 'Company entity added successfully!');
                hideCompanyForm();
                await loadCompanies();
            } else {
                const data = await res.json();
                notify(data.detail || 'Failed to save company information', 'error');
            }
        } catch(e) {
            notify('Network error saving company', 'error');
        }
    }

    async function deleteCompanyRecord(id) {
        const linkedBranches = currentBranches.filter(b => b.company_id === id);
        if (linkedBranches.length > 0) {
            notify(`Cannot delete: this company still has ${linkedBranches.length} active Branch Sites assigned to it. Unassign or delete those branches first.`, 'error');
            return;
        }

        showConfirm('Are you sure you want to delete this company? Employees belonging to this company will no longer be linked to it.', async () => {
            try {
                const res = await fetch(`/ui/companies/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    notify('Company entity deleted successfully.');
                    await loadCompanies();
                } else {
                    notify('Failed to delete company.', 'error');
                }
            } catch(e) {
                notify('Network error deleting company', 'error');
            }
        });
    }

    // ── Roster & Shift Planner ──────────────────────────────────────
    let currentRosterYear = new Date().getFullYear();
    let currentRosterMonth = new Date().getMonth(); // 0-indexed

    async function loadRosterPlanner() {
        // Update Month Label
        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];
        document.getElementById('rosterMonthLabel').innerText = `${monthNames[currentRosterMonth]} ${currentRosterYear}`;

        // Populate Employee and Shift Select inputs
        await populateRosterDropdowns();

        // Load assignments and render grid
        await renderRosterGrid();
    }

    async function changeRosterMonth(delta) {
        currentRosterMonth += delta;
        if (currentRosterMonth > 11) {
            currentRosterMonth = 0;
            currentRosterYear += 1;
        } else if (currentRosterMonth < 0) {
            currentRosterMonth = 11;
            currentRosterYear -= 1;
        }
        await loadRosterPlanner();
    }

    async function populateRosterDropdowns() {
        const empSelect = document.getElementById('rosterEmployeeSelect');
        const shiftSelect = document.getElementById('rosterShiftSelect');

        // Fetch employees
        try {
            const empRes = await fetch('/ui/employees');
            if (empRes.ok) {
                const employees = await empRes.json();
                empSelect.innerHTML = '<option value="">-- Choose Employee --</option>';
                employees.forEach(emp => {
                    empSelect.innerHTML += `<option value="${emp.employee_id}">${emp.full_name} (${emp.employee_id})</option>`;
                });
            }
        } catch (e) {
            console.error("Error loading employees for roster dropdown", e);
        }

        // Fetch shifts
        try {
            const shiftRes = await fetch('/ui/shift-schedules');
            if (shiftRes.ok) {
                const shifts = await shiftRes.json();
                shiftSelect.innerHTML = '<option value="">-- Choose Shift Override --</option>';
                shifts.forEach(shift => {
                    shiftSelect.innerHTML += `<option value="${shift.id}">${shift.name} (${shift.start_time}-${shift.end_time})</option>`;
                });
            }
        } catch (e) {
            console.error("Error loading shifts for roster dropdown", e);
        }
    }

    async function renderRosterGrid() {
        const headerRow = document.getElementById('rosterHeaderRow');
        const tbody = document.getElementById('rosterTbody');

        // Clear previous grid columns (keep first one "Employee")
        headerRow.innerHTML = '<th class="px-4 py-3 text-left min-w-[200px] border-r border-slate-200 dark:border-slate-800">Employee</th>';
        tbody.innerHTML = '';

        // Get days in the selected month
        const daysInMonth = new Date(currentRosterYear, currentRosterMonth + 1, 0).getDate();

        // 1. Render Table Headers for each date
        const dateStrings = []; // YYYY-MM-DD
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${currentRosterYear}-${String(currentRosterMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            dateStrings.push(dateStr);

            const th = document.createElement('th');
            th.className = "px-2 py-2 text-center border-r border-slate-200 dark:border-slate-800 min-w-[65px]";
            // Show day name abbreviation + day number
            const dateObj = new Date(currentRosterYear, currentRosterMonth, day);
            const dayAbbrev = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
            th.innerHTML = `<span class="block text-[10px] uppercase font-normal text-slate-400 dark:text-slate-500">${dayAbbrev}</span><span class="text-xs font-bold text-slate-800 dark:text-slate-200">${day}</span>`;
            headerRow.appendChild(th);
        }

        // 2. Fetch employees and shifts to match assignments
        try {
            const [empRes, shiftRes, assignRes] = await Promise.all([
                fetch('/ui/employees'),
                fetch('/ui/shift-schedules'),
                fetch(`/ui/schedule-assignments?start_date=${dateStrings[0]}&end_date=${dateStrings[daysInMonth - 1]}`)
            ]);

            if (!empRes.ok || !shiftRes.ok || !assignRes.ok) {
                tbody.innerHTML = '<tr><td colspan="100%" class="px-4 py-8 text-center text-red-500">Failed to fetch roster data</td></tr>';
                return;
            }

            const employees = await empRes.json();
            const shifts = await shiftRes.json();
            const assignments = await assignRes.json();

            // Create mappings
            const shiftMap = {};
            shifts.forEach(s => shiftMap[s.id] = s);

            if (employees.length === 0) {
                tbody.innerHTML = '<tr><td colspan="100%" class="px-4 py-8 text-center text-slate-500 dark:text-slate-400">No employees available to schedule.</td></tr>';
                return;
            }

            // 3. Render a row per employee
            employees.forEach(emp => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors";

                // First cell: employee name
                const tdName = document.createElement('td');
                tdName.className = "px-4 py-3 font-medium text-slate-900 dark:text-slate-100 border-r border-slate-200 dark:border-slate-800";
                tdName.innerHTML = `<div class="font-bold">${emp.full_name}</div><div class="text-[10px] text-slate-550 dark:text-slate-400">${emp.employee_id}</div>`;
                tr.appendChild(tdName);

                // Render each calendar day cell for this employee
                dateStrings.forEach(dateStr => {
                    const tdDay = document.createElement('td');
                    tdDay.className = "px-1 py-2 text-center border-r border-slate-200 dark:border-slate-800 relative group";

                    // Find active assignment for this employee on this date
                    const activeAssign = assignments.find(a => {
                        if (a.employee_id !== emp.employee_id) return false;
                        const effDate = a.effective_date;
                        const endDate = a.end_date;
                        return dateStr >= effDate && (!endDate || dateStr <= endDate);
                    });

                    if (activeAssign) {
                        const shift = shiftMap[activeAssign.shift_schedule_id];
                        if (shift) {
                            tdDay.innerHTML = `
                                <div class="inline-flex flex-col items-center justify-center rounded-lg bg-indigo-50 border border-indigo-150 px-2 py-1 text-[10px] text-indigo-750 font-bold dark:bg-indigo-950/40 dark:border-indigo-900/60 dark:text-indigo-300 shadow-xs w-full max-w-[80px]" title="${shift.name} (${shift.start_time} - ${shift.end_time})">
                                    <span class="truncate block max-w-full">${shift.name}</span>
                                    <span class="text-[8px] opacity-75 font-semibold block">${shift.start_time}-${shift.end_time}</span>
                                    <button class="absolute -top-1.5 -right-1.5 rounded-full bg-red-100 text-red-700 hover:bg-red-200 h-4 w-4 flex items-center justify-center text-[9px] shadow-sm hidden group-hover:flex transition-all border border-red-200 dark:bg-red-950/80 dark:text-red-300 dark:border-red-900" onclick="deleteRosterAssignment(${activeAssign.id})">
                                        &times;
                                    </button>
                                </div>
                            `;
                        } else {
                            tdDay.innerHTML = `<span class="text-xs text-slate-400 font-mono">ID:${activeAssign.shift_schedule_id}</span>`;
                        }
                    } else {
                        // Empty cell (default schedule)
                        tdDay.innerHTML = `
                            <div class="text-[10px] text-slate-400 italic">Default</div>
                        `;
                    }

                    tr.appendChild(tdDay);
                });

                tbody.appendChild(tr);
            });

        } catch (e) {
            console.error("Error rendering roster planner grid", e);
            tbody.innerHTML = '<tr><td colspan="100%" class="px-4 py-8 text-center text-red-500">Error loading planner grid.</td></tr>';
        }
    }

    async function assignRosterShift() {
        const employeeId = document.getElementById('rosterEmployeeSelect').value;
        const shiftId = document.getElementById('rosterShiftSelect').value;
        const startDate = document.getElementById('rosterStartDate').value;
        const endDate = document.getElementById('rosterEndDate').value;

        if (!employeeId || !shiftId || !startDate) {
            notify('Please specify Employee, Shift, and Start Date.', 'error');
            return;
        }

        const payload = {
            employee_id: employeeId,
            shift_schedule_id: parseInt(shiftId),
            effective_date: startDate,
            end_date: endDate || null
        };

        try {
            const res = await fetch('/ui/schedule-assignments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                notify('Shift assignment successfully scheduled!');
                // Reset inputs
                document.getElementById('rosterStartDate').value = '';
                document.getElementById('rosterEndDate').value = '';
                await renderRosterGrid();
            } else {
                const data = await res.json();
                notify(data.detail || 'Failed to assign roster shift.', 'error');
            }
        } catch (e) {
            notify('Network error when creating roster assignment.', 'error');
        }
    }

    async function deleteRosterAssignment(id) {
        showConfirm('Are you sure you want to delete this roster shift assignment? It will revert to the default shift schedule for that day.', async () => {
            try {
                const res = await fetch(`/ui/schedule-assignments/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    notify('Roster shift assignment successfully deleted.');
                    await renderRosterGrid();
                } else {
                    notify('Failed to delete assignment.', 'error');
                }
            } catch (e) {
                notify('Network error when deleting assignment.', 'error');
            }
        });
    }
