{% extends "layout.html" %}

{% block title %}Help & Documentation — Virtual Attendance{% endblock %}

{% block extra_css %}
<style>
    .help-main .info-box {
        border-left-width: 4px;
    }
    .help-main .step-list {
        counter-reset: step;
        list-style: none;
        padding-left: 0;
    }
    .help-main .step-list li {
        counter-increment: step;
        position: relative;
        padding: 0.75rem 1rem 0.75rem 3rem;
        background: #f8fafc;
        border-radius: 0.5rem;
        margin-bottom: 0.5rem;
    }
    .help-main .step-list li::before {
        content: counter(step);
        position: absolute;
        left: 0.75rem;
        top: 0.75rem;
        width: 1.5rem;
        height: 1.5rem;
        background: #4f46e5;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
    }
</style>
{% endblock %}

{% block content %}
<div class="flex h-full overflow-hidden">
    <!-- Help Sidebar -->
    <div class="w-72 flex-shrink-0 border-r border-slate-200 overflow-y-auto bg-white dark:border-slate-800 dark:bg-slate-900" id="help-sidebar">
        <!-- Populated by JS -->
    </div>
    
    <!-- Help Main Content -->
    <div class="flex-1 overflow-y-auto p-8 help-main" id="help-main">
        <!-- Populated by JS -->
    </div>
</div>
{% endblock %}

                    content: `<p class="text-sm text-slate-700 leading-relaxed mb-4 dark:text-slate-300">The system syncs attendance data with your existing ADMS (ZKTeco) server. However, it is important to understand that the middleware communicates with the ADMS server through a <strong>separate, asynchronous sync layer</strong> — not in real-time.</p>

<h3 class="text-base font-semibold text-slate-800 mt-6 mb-3 dark:text-slate-100">🏗️ Two-Layer Architecture</h3>
<p class="text-sm text-slate-700 mb-4 dark:text-slate-300">The attendance system has <strong>two independent communication layers</strong>. Understanding this distinction explains why the ADMS Sync dashboard exists and why ADMS can show "Disconnected" even when the middleware is working perfectly:</p>

<div class="bg-indigo-50 border border-indigo-200 rounded-xl p-4 mb-4 text-sm dark:bg-indigo-950/30 dark:border-indigo-800/60">
<h4 class="font-semibold text-indigo-700 mb-2 dark:text-indigo-400">Layer 1: Mobile App ↔ Middleware (REST API — Always On)</h4>
<p class="text-indigo-700 mb-2 dark:text-indigo-400">This is the <strong>primary, real-time</strong> communication path. When an employee clocks in/out on their phone:</p>
<ul class="text-indigo-700 space-y-1 pl-5 list-disc dark:text-indigo-400">
<li>The app sends a JSON request directly to the middleware via HTTP REST API</li>
<li>The middleware records the punch in PostgreSQL immediately</li>
<li>This works as long as the middleware server is running — <strong>no ADMS server required</strong></li>
<li>If the phone is offline, punches are stored locally and synced when connectivity returns</li>
</ul>
</div>

<div class="bg-red-50 border border-red-200 rounded-xl p-4 mb-4 text-sm dark:bg-red-950/30">
<h4 class="font-semibold text-red-700 mb-2 dark:text-red-400">Layer 2: Middleware ↔ ADMS Server (Async Queue — Separate Connection)</h4>
<p class="text-red-700 mb-2 dark:text-red-400">This is a <strong>background sync</strong> that pushes recorded punches to your legacy ZKTeco ADMS server:</p>
<ul class="text-red-700 space-y-1 pl-5 list-disc dark:text-red-400">
<li>After a punch is saved in PostgreSQL, it is <strong>queued</strong> for ADMS sync</li>
<li>An ARQ background worker picks up queued punches and pushes them to the ADMS server using the ZKTeco iClock protocol</li>
<li>The ADMS server can be <strong>down, unreachable, or misconfigured</strong> without affecting Layer 1 — employees can still punch normally</li>
<li>Sync is asynchronous — there may be a delay between a punch being recorded and it appearing on the ADMS server</li>
</ul>
</div>

<h3 class="text-base font-semibold text-slate-800 mt-6 mb-3 dark:text-slate-100">❓ Why Does The ADMS Sync Dashboard Show "Disconnected"?</h3>
<p class="text-sm text-slate-700 mb-3 dark:text-slate-300">The ADMS Sync Status on the admin dashboard checks <strong>Layer 2 only</strong> — it tests whether the middleware can establish a handshake with the ADMS server. A "Disconnected" status means:</p>
<ul class="text-sm text-slate-700 space-y-1.5 pl-5 mb-4 list-disc dark:text-slate-300">
<li>The ADMS server URL or credentials may be incorrect</li>
<li>The ADMS server may be down or unreachable from the middleware</li>
<li>A firewall may be blocking the connection between the middleware and the ADMS server</li>
<li><strong>It does NOT mean the attendance system is broken</strong> — employees can still clock in/out normally via Layer 1</li>
</ul>
<p class="text-sm text-slate-600 mb-4 dark:text-slate-400">The dashboard is designed to give you <strong>visibility into Layer 2</strong> so you know when ADMS sync is falling behind and can investigate the ADMS server or network issues.</p>

<h3 class="text-base font-semibold text-slate-800 mt-6 mb-3 dark:text-slate-100">Configuration Steps</h3>
<ol class="text-sm text-slate-700 space-y-1.5 pl-5 mb-4 list-decimal dark:text-slate-300">
<li><strong>Add ADMS Target</strong> — Enter Server URL, Device Serial Number, Device Name</li>
<li><strong>Set Credentials</strong> — Enter Username and Password for ADMS</li>
<li><strong>Enable Sync</strong> — The system starts syncing automatically</li>
</ol>

<h3 class="text-base font-semibold text-slate-800 mt-6 mb-3 dark:text-slate-100">How the Sync Queue Works</h3>
<ul class="text-sm text-slate-700 space-y-1.5 pl-5 mb-4 list-disc dark:text-slate-300">
<li>Each punch is queued in PostgreSQL with a <code class="text-xs bg-slate-100 px-1.5 py-0.5 rounded font-mono dark:bg-slate-800">server_sync_status</code> of <code class="text-xs bg-slate-100 px-1.5 py-0.5 rounded font-mono dark:bg-slate-800">pending</code></li>
<li>The ARQ worker picks up pending punches and pushes them via the ZKTeco iClock protocol (<code class="text-xs bg-slate-100 px-1.5 py-0.5 rounded font-mono dark:bg-slate-800">POST /iclock/cdata?table=ATTLOG</code>)</li>
<li>A handshake with the ADMS server occurs every 60 seconds to maintain the connection</li>
<li>Failed punches retry with exponential backoff (10s → 20s → 40s → 80s → 160s, up to ~5 minutes max)</li>
<li>Punches older than 7 days that are still pending are marked as <code class="text-xs bg-slate-100 px-1.5 py-0.5 rounded font-mono dark:bg-slate-800">stale</code></li>
<li>You can manually trigger a sync retry from the ADMS Sync dashboard</li>
</ul>

<h3 class="text-base font-semibold text-slate-800 mt-6 mb-3 dark:text-slate-100">Summary</h3>
<div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800">
<table class="w-full text-sm">

<tr class="bg-slate-50 dark:bg-slate-800/50">
<th class="px-4 py-3 text-left text-xs font-semibold uppercase text-slate-500 border-b border-slate-200 dark:text-slate-400 dark:border-slate-800">Aspect</th>
<th class="px-4 py-3 text-left text-xs font-semibold uppercase text-slate-500 border-b border-slate-200 dark:text-slate-400 dark:border-slate-800">Layer 1 (Mobile ↔ Middleware)</th>
<th class="px-4 py-3 text-left text-xs font-semibold uppercase text-slate-500 border-b border-slate-200 dark:text-slate-400 dark:border-slate-800">Layer 2 (Middleware ↔ ADMS)</th>

<td class="px-4 py-3 border-b border-slate-100 font-semibold text-slate-700 dark:border-slate-800/50 dark:text-slate-300"><strong>Protocol</strong></td>

<td class="px-4 py-3 border-b border-slate-100 font-semibold text-slate-700 dark:border-slate-800/50 dark:text-slate-300"><strong>Timing</strong></td>

<td class="px-4 py-3 border-b border-slate-100 text-slate-600 dark:border-slate-800/50 dark:text-slate-400">Async (queued, batched)</td>
</tr>

// Render help page
document.addEventListener('DOMContentLoaded', function() {
    const sidebar = document.getElementById('help-sidebar');
    const main = document.getElementById('help-main');
    let selectedArticle = null;
    let searchQuery = '';
    let collapsedSections = new Set();

    function renderSidebar() {
        const filtered = helpDocs.sections.map(section => {
            const articles = section.articles.filter(a =>
                !searchQuery ||
                a.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                a.content.toLowerCase().includes(searchQuery.toLowerCase())
            );
            return { ...section, articles };
        }).filter(s => !searchQuery || s.articles.length > 0);

        let html = '<div class="m-4"><input type="text" class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" placeholder="Search documentation..." id="help-search" value="' + searchQuery.replace(/"/g, '"') + '"></div>';
        
        filtered.forEach(section => {
            const isExpanded = !collapsedSections.has(section.id);
            html += '<div class="mb-1">';
            html += '<button class="flex items-center gap-2 w-full px-4 py-2 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-indigo-600 transition-colors border-0 bg-transparent cursor-pointer text-left dark:text-slate-400" onclick="toggleSection(\'' + section.id + '\')">';
            html += '<span class="text-xs w-3 flex-shrink-0">' + (isExpanded ? '▼' : '▶') + '</span> ';
            html += '<span class="text-sm flex-shrink-0">' + section.icon + '</span> ' + section.title;
            html += '</button>';
            if (isExpanded) {
                section.articles.forEach(article => {
                    const isActive = selectedArticle === article.id;
                    html += '<button class="block w-full text-left px-4 py-2 pl-12 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 rounded-lg transition-colors border-0 bg-transparent cursor-pointer' + (isActive ? ' bg-indigo-50 text-indigo-700 font-semibold' : '') dark:text-slate-300 dark:hover:bg-indigo-950/30 dark:bg-indigo-950/30 dark:text-indigo-400" onclick="selectArticle(\'' + section.id + '\', \'' + article.id + '\')">' + article.title + '</button>';
                });
            }
            html += '</div>';
        });
        
        sidebar.innerHTML = html;
        
        document.getElementById('help-search').addEventListener('input', function(e) {
            searchQuery = e.target.value;
            selectedArticle = null;
            collapsedSections.clear();
            renderSidebar();
            renderWelcome();
        });
    }

    function renderArticle(sectionId, articleId) {
        const section = helpDocs.sections.find(s => s.id === sectionId);
        if (!section) return;
        const article = section.articles.find(a => a.id === articleId);
        if (!article) return;
        
        selectedArticle = articleId;
        
        document.getElementById('page-title').textContent = article.title;
        
        main.innerHTML = '<div class="rounded-xl border border-slate-200 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900"><h1 class="text-2xl font-bold text-slate-800 mb-6 dark:text-slate-100">' + article.title + '</h1>' + article.content + '</div>';
        renderSidebar();
    }

    function renderWelcome() {
        selectedArticle = null;
        document.getElementById('page-title').textContent = 'Help & Documentation';
        
        let html = '<div class="text-center py-12 px-8">';
        html += '<div class="text-4xl text-indigo-500 mb-4 dark:text-indigo-400">📖</div>';
        html += '<h1 class="text-2xl font-bold text-slate-800 mb-2 dark:text-slate-100">Help & Documentation</h1>';
        html += '<p class="text-sm text-slate-500 max-w-lg mx-auto dark:text-slate-400">Select a topic from the sidebar to get started, or browse the quick links below.</p>';
        html += '<div class="grid grid-cols-2 md:grid-cols-3 gap-5 mt-10 max-w-3xl mx-auto">';
        
        helpDocs.sections.forEach(section => {
            html += '<div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm cursor-pointer text-center hover:shadow-md hover:border-indigo-300 transition-all dark:border-slate-800 dark:bg-slate-900" onclick="selectArticle(\'' + section.id + '\', \'' + section.articles[0].id + '\')">';
            html += '<div class="text-3xl mb-3">' + section.icon + '</div>';
            html += '<div class="text-xs font-semibold uppercase tracking-wider text-slate-800 dark:text-slate-100">' + section.title + '</div>';
            html += '</div>';
        });
        
        html += '</div></div>';
        main.innerHTML = html;
        renderSidebar();
    }

    window.toggleSection = function(sectionId) {
        if (collapsedSections.has(sectionId)) {
            collapsedSections.delete(sectionId);
        } else {
            collapsedSections.add(sectionId);
        }
        renderSidebar();
    };

    window.selectArticle = function(sectionId, articleId) {
        renderArticle(sectionId, articleId);
    };

    renderWelcome();
});
</script>
