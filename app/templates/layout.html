<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Virtual Attendance — Admin{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Leaflet (Interactive Map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="/static/css/styles.css?v=3">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="ph-fill ph-fingerprint logo-icon"></i>
                <div class="logo-text">Virtual<br>Attendance</div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/ui/#dashboard" class="nav-item active" data-tab="dashboard">
                    <i class="ph ph-squares-four"></i>
                    <span>Overview</span>
                </a>
                <a href="/ui/adms-sync-status" class="nav-item" id="navAdmsSync">
                    <i class="ph ph-arrows-clockwise"></i>
                    <span>ADMS Sync</span>
                    <span id="admsSidebarBadge" style="margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: #64748b; display: inline-block; flex-shrink: 0;" title="Checking..."></span>
                </a>
                <a href="/ui/#devices" class="nav-item" data-tab="devices">
                    <i class="ph ph-devices"></i>
                    <span>Devices</span>
                </a>
                <a href="/ui/#geofence" class="nav-item" data-tab="geofence">
                    <i class="ph ph-map-pin"></i>
                    <span>Branches</span>
                </a>
                <a href="/ui/#settings" class="nav-item" data-tab="settings">
                    <i class="ph ph-gear"></i>
                    <span>ADMS Config</span>
                </a>
                <a href="/ui/#punch-types" class="nav-item" data-tab="punch-types">
                    <i class="ph ph-list-dashes"></i>
                    <span>Punch Types</span>
                </a>
                <a href="/ui/#profile" class="nav-item" data-tab="profile">
                    <i class="ph ph-users"></i>
                    <span>Users</span>
                </a>
                <a href="/ui/supervisors" class="nav-item">
                    <i class="ph ph-users-three"></i>
                    <span>Supervisors</span>
                </a>
                <a href="/ui/help" class="nav-item">
                    <i class="ph ph-question"></i>
                    <span>Help & Docs</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="/logout" class="nav-item" style="color: var(--danger);margin-bottom:0.5rem;">
                    <i class="ph ph-sign-out"></i>
                    <span>Logout</span>
                </a>
                <div class="version-badge">Middleware v1.0</div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-title" id="page-title">Dashboard Overview</div>
                <div class="header-actions">
                    <div class="admin-profile">
                        <i class="ph-fill ph-user-circle"></i>
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <main class="content-area">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script>
        // ── Toast Notification System ────────────────────────────────────
        function notify(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const icons = {
                success: 'ph-check-circle',
                error: 'ph-x-circle',
                warning: 'ph-warning',
                info: 'ph-info',
            };

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<i class="ph ${icons[type] || icons.info}"></i> ${message}`;
            toast.addEventListener('click', () => {
                toast.classList.add('toast-out');
                setTimeout(() => toast.remove(), 300);
            });
            container.appendChild(toast);

            setTimeout(() => {
                if (toast.isConnected) {
                    toast.classList.add('toast-out');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        // ── Modal Helpers ───────────────────────────────────────────────
        function openModal(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.add('active');
                modal.style.display = 'flex';
            }
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.remove('active');
                modal.style.display = 'none';
            }
        }

        // Close modal on overlay click
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
                e.target.style.display = 'none';
            }
        });

        // ── Highlight active sidebar nav ────────────────────────────────
        document.addEventListener('DOMContentLoaded', function() {
            const path = window.location.pathname;
            const navItems = document.querySelectorAll('.nav-item');
            
            const pathMap = {
                '/ui/adms-sync-status': 'ADMS Sync',
                '/ui/supervisors': 'Supervisors',
                '/ui/help': 'Help & Docs',
            };
            
            const matchedTitle = pathMap[path];
            if (matchedTitle) {
                navItems.forEach(item => {
                    item.classList.remove('active');
                    if (item.innerText.trim() === matchedTitle) {
                        item.classList.add('active');
                    }
                });
                const titleEl = document.getElementById('page-title');
                if (titleEl) titleEl.innerText = matchedTitle;
            }

            // ADMS Sidebar Status Badge
            updateAdmsBadge();
            setInterval(updateAdmsBadge, 15000);
        });

        async function updateAdmsBadge() {
            const badge = document.getElementById('admsSidebarBadge');
            if (!badge) return;
            try {
                const res = await fetch('/ui/adms-sync-info');
                if (!res.ok) throw new Error('Not available');
                const info = await res.json();
                if (info.heartbeat_connected) {
                    badge.style.background = '#10b981';
                    badge.title = 'ADMS Connected';
                } else {
                    badge.style.background = '#ef4444';
                    badge.title = info.heartbeat_last_error || 'ADMS Disconnected';
                }
            } catch {
                badge.style.background = '#64748b';
                badge.title = 'Status unknown';
            }
        }

        // ── Confirmation Modal ──────────────────────────────────────────
        function showConfirm(html, onConfirm) {
            const modal = document.getElementById('confirmModal');
            const msg = document.getElementById('confirmMsg');
            const yesBtn = document.getElementById('confirmYesBtn');
            const noBtn = document.getElementById('confirmNoBtn');
            if (!modal || !msg || !yesBtn || !noBtn) return;

            msg.innerHTML = html;
            openModal('confirmModal');

            const cleanup = () => {
                closeModal('confirmModal');
                yesBtn.onclick = null;
                noBtn.onclick = null;
            };

            yesBtn.onclick = () => { cleanup(); onConfirm(); };
            noBtn.onclick = cleanup;
        }

        // ── Tab Navigation ──────────────────────────────────────────────
        function showTab(tabId) {
            document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            const supervisorDiv = document.querySelector('.supervisor-management');
            if (supervisorDiv) supervisorDiv.style.display = 'none';
            
            const content = document.getElementById(tabId);
            if (content) {
                content.style.display = 'block';
                const navItem = document.querySelector(`.nav-item[data-tab="${tabId}"]`);
                if (navItem) {
                    navItem.classList.add('active');
                    document.getElementById('page-title').innerText = navItem.innerText.trim();
                }
                
                if (tabId === 'security') loadApiKeys();
                if (tabId === 'geofence') { loadBranches(); initBranchMap(); }
                if (tabId === 'profile') loadUsers();
                if (tabId === 'punch-types') loadPunchTypes();
                if (tabId === 'settings') loadAdmsSyncSettings();
            }
        }

        document.querySelectorAll('.nav-item[data-tab]').forEach(tab => {
            tab.addEventListener('click', (e) => {
                if (window.location.pathname === '/ui' || window.location.pathname === '/ui/') {
                    e.preventDefault();
                    const targetTab = tab.dataset.tab;
                    showTab(targetTab);
                    window.location.hash = targetTab;
                }
            });
        });

        function localizeTimestamps() {
            document.querySelectorAll('.local-time').forEach(el => {
                const utcStr = el.getAttribute('data-utc');
                if (utcStr) {
                    const localDate = new Date(utcStr);
                    if (!isNaN(localDate.getTime())) {
                        const year = localDate.getFullYear();
                        const month = String(localDate.getMonth() + 1).padStart(2, '0');
                        const day = String(localDate.getDate()).padStart(2, '0');
                        const hours = String(localDate.getHours()).padStart(2, '0');
                        const minutes = String(localDate.getMinutes()).padStart(2, '0');
                        const seconds = String(localDate.getSeconds()).padStart(2, '0');
                        el.textContent = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                    }
                }
            });
        }

        window.addEventListener('load', () => {
            localizeTimestamps();
            if (window.location.pathname === '/ui' || window.location.pathname === '/ui/') {
                const hash = window.location.hash.replace('#', '') || 'dashboard';
                showTab(hash);
            }
        });

        window.addEventListener('hashchange', () => {
            if (window.location.pathname === '/ui' || window.location.pathname === '/ui/') {
                const hash = window.location.hash.replace('#', '') || 'dashboard';
                showTab(hash);
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
