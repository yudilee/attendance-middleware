<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Virtual Attendance — Admin{% endblock %}</title>
    
    <!-- Inter Font (Laravel Default) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Dark Mode Initializer -->
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    
    <!-- Leaflet (Interactive Map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    
    <!-- QRCode.js -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/styles.css?v=4">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen">

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-2 max-w-sm"></div>

    <div class="flex h-screen overflow-hidden">
        <!-- ═══════════════ SIDEBAR ═══════════════ -->
        <aside id="sidebar" class="sidebar w-64 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 flex flex-col flex-shrink-0 border-r border-slate-200 dark:border-slate-800 overflow-hidden md:w-64">
            <!-- Sidebar Header -->
            <div class="flex items-center gap-3 px-5 py-4 border-b border-slate-200 dark:border-slate-800 min-h-[64px]">
                <i class="ph-fill ph-fingerprint text-2xl text-primary-600 dark:text-primary-400"></i>
                <div class="font-bold text-base leading-tight text-slate-800 dark:text-white tracking-tight">
                    Virtual<br>Attendance
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-3 py-4 flex flex-col gap-0.5 overflow-y-auto">
                <a href="/ui/#dashboard" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150" data-tab="dashboard">
                    <i class="ph ph-squares-four text-lg w-5 text-center flex-shrink-0"></i>
                    <span>Overview</span>
                </a>
                <a href="/ui/adms-sync-status" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150" id="navAdmsSync">
                    <i class="ph ph-arrows-clockwise text-lg w-5 text-center flex-shrink-0"></i>
                    <span>ADMS Sync</span>
                    <span id="admsSidebarBadge" class="ml-auto w-2 h-2 rounded-full flex-shrink-0" style="background:#64748b;" title="Checking..."></span>
                </a>
                <a href="/ui/#devices" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150" data-tab="devices">
                    <i class="ph ph-devices text-lg w-5 text-center flex-shrink-0"></i>
                    <span>Devices</span>
                </a>
                <a href="/ui/#geofence" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150" data-tab="geofence">
                    <i class="ph ph-map-pin text-lg w-5 text-center flex-shrink-0"></i>
                    <span>Branches</span>
                </a>
                <a href="/ui/#settings" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150" data-tab="settings">
                    <i class="ph ph-gear text-lg w-5 text-center flex-shrink-0"></i>
                    <span>ADMS Config</span>
                </a>
                <a href="/ui/#security" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150" data-tab="security">
                    <i class="ph ph-key text-lg w-5 text-center flex-shrink-0"></i>
                    <span>API Keys</span>
                </a>
                <a href="/ui/#punch-types" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150" data-tab="punch-types">
                    <i class="ph ph-list-dashes text-lg w-5 text-center flex-shrink-0"></i>
                    <span>Punch Types</span>
                </a>
                <a href="/ui/#employees" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150" data-tab="employees">
                    <i class="ph ph-identification-card text-lg w-5 text-center flex-shrink-0"></i>
                    <span>Employees</span>
                </a>
                <a href="/ui/#profile" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150" data-tab="profile">
                    <i class="ph ph-users text-lg w-5 text-center flex-shrink-0"></i>
                    <span>Users</span>
                </a>
                <a href="/ui/supervisors" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150">
                    <i class="ph ph-users-three text-lg w-5 text-center flex-shrink-0"></i>
                    <span>Supervisors</span>
                </a>
                <a href="/ui/#audit-logs" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150" data-tab="audit-logs">
                    <i class="ph ph-shield-checkered text-lg w-5 text-center flex-shrink-0"></i>
                    <span>Audit Trail</span>
                </a>
                <a href="/ui/help" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-150">
                    <i class="ph ph-question text-lg w-5 text-center flex-shrink-0"></i>
                    <span>Help & Docs</span>
                </a>
            </nav>

            <!-- Sidebar Footer -->
            <div class="px-5 py-4 border-t border-slate-200 dark:border-slate-800 space-y-2">
                <a href="/logout" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-white/5 hover:text-red-700 dark:hover:text-red-200 transition-all duration-150">
                    <i class="ph ph-sign-out text-lg w-5 text-center flex-shrink-0"></i>
                    <span>Logout</span>
                </a>
                <div class="bg-slate-100 dark:bg-white/5 text-slate-500 px-3 py-1.5 rounded-lg text-xs font-semibold text-center tracking-wide">
                    Middleware v1.0
                </div>
            </div>
        </aside>

        <!-- ═══════════════ MAIN CONTENT ═══════════════ -->
        <div class="flex-1 flex flex-col overflow-hidden min-w-0">
            <!-- Top Header -->
            <header class="top-header h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 shadow-sm z-20 flex-shrink-0">
                <!-- Mobile sidebar toggle -->
                <button id="mobileSidebarToggle" class="md:hidden text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-2 -ml-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                    <i class="ph ph-list text-xl"></i>
                </button>
                <div id="page-title" class="text-lg font-semibold text-slate-800 dark:text-white">Dashboard Overview</div>
                <div class="flex items-center gap-4">
                    <!-- Dark Mode Toggle Button -->
                    <button id="themeToggle" class="text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200" title="Toggle Theme">
                        <i id="themeToggleDarkIcon" class="ph ph-moon text-xl hidden"></i>
                        <i id="themeToggleLightIcon" class="ph ph-sun text-xl hidden"></i>
                    </button>

                    <div class="flex items-center gap-2 px-3 py-1.5 bg-slate-50 dark:bg-slate-800 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-200">
                        <i class="ph-fill ph-user-circle text-xl text-slate-400"></i>
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <main class="flex-1 overflow-y-auto px-6 py-8">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script>
        // ── Toast Notification System ────────────────────────────────────
        function notify(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const icons = {
                success: 'ph-check-circle',
                error: 'ph-x-circle',
                warning: 'ph-warning',
                info: 'ph-info',
            };

            const colors = {
                success: 'bg-emerald-600',
                error: 'bg-red-600',
                warning: 'bg-amber-600',
                info: 'bg-sky-600',
            };

            const toast = document.createElement('div');
            toast.className = `toast ${colors[type] || colors.info} text-white rounded-xl px-5 py-3 text-sm font-medium shadow-lg flex items-center gap-3 cursor-pointer`;
            toast.innerHTML = `<i class="ph ${icons[type] || icons.info} text-lg flex-shrink-0"></i> ${message}`;
            toast.addEventListener('click', () => {
                toast.classList.add('toast-out');
                setTimeout(() => toast.remove(), 300);
            });
            container.appendChild(toast);

            setTimeout(() => {
                if (toast.isConnected) {
                    toast.classList.add('toast-out');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        // ── Modal Helpers ───────────────────────────────────────────────
        function openModal(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.add('active');
                modal.classList.remove('hidden');
                modal.style.display = 'flex';
            }
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.remove('active');
                modal.style.display = 'none';
            }
        }

        // Close modal on overlay click
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
                e.target.style.display = 'none';
            }
        });

        // ── Mobile sidebar toggle ───────────────────────────────────────
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.getElementById('mobileSidebarToggle');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            if (toggle && sidebar) {
                toggle.addEventListener('click', function() {
                    sidebar.classList.toggle('-translate-x-full');
                    if (sidebarOverlay) {
                        sidebarOverlay.classList.toggle('hidden');
                    }
                });
            }
        });

        // ── Highlight active sidebar nav ────────────────────────────────
        document.addEventListener('DOMContentLoaded', function() {
            const path = window.location.pathname;
            const navItems = document.querySelectorAll('.nav-item');
            
            const pathMap = {
                '/ui/adms-sync-status': 'ADMS Sync',
                '/ui/supervisors': 'Supervisors',
                '/ui/help': 'Help & Docs',
            };
            
            const matchedTitle = pathMap[path];
            if (matchedTitle) {
                navItems.forEach(item => {
                    item.classList.remove('active');
                    if (item.innerText.trim() === matchedTitle) {
                        item.classList.add('active');
                    }
                });
                const titleEl = document.getElementById('page-title');
                if (titleEl) titleEl.innerText = matchedTitle;
            }

            // ADMS Sidebar Status Badge
            updateAdmsBadge();
            setInterval(updateAdmsBadge, 15000);
        });

        async function updateAdmsBadge() {
            const badge = document.getElementById('admsSidebarBadge');
            if (!badge) return;
            try {
                const res = await fetch('/ui/adms-sync-info');
                if (!res.ok) throw new Error('Not available');
                const info = await res.json();
                if (info.heartbeat_connected) {
                    badge.style.background = '#10b981';
                    badge.title = 'ADMS Connected';
                } else {
                    badge.style.background = '#ef4444';
                    badge.title = info.heartbeat_last_error || 'ADMS Disconnected';
                }
            } catch {
                badge.style.background = '#64748b';
                badge.title = 'Status unknown';
            }
        }

        // ── Confirmation Modal ──────────────────────────────────────────
        function showConfirm(html, onConfirm) {
            const modal = document.getElementById('confirmModal');
            const msg = document.getElementById('confirmMsg');
            const yesBtn = document.getElementById('confirmYesBtn');
            const noBtn = document.getElementById('confirmNoBtn');
            if (!modal || !msg || !yesBtn || !noBtn) return;

            msg.innerHTML = html;
            openModal('confirmModal');

            const cleanup = () => {
                closeModal('confirmModal');
                yesBtn.onclick = null;
                noBtn.onclick = null;
            };

            yesBtn.onclick = () => { cleanup(); onConfirm(); };
            noBtn.onclick = cleanup;
        }

        // ── Tab Navigation ──────────────────────────────────────────────
        function showTab(tabId) {
            document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            const supervisorDiv = document.querySelector('.supervisor-management');
            if (supervisorDiv) supervisorDiv.style.display = 'none';
            
            const content = document.getElementById(tabId);
            if (content) {
                content.style.display = 'block';
                const navItem = document.querySelector(`.nav-item[data-tab="${tabId}"]`);
                if (navItem) {
                    navItem.classList.add('active');
                    document.getElementById('page-title').innerText = navItem.innerText.trim();
                }
                
                if (tabId === 'security') loadApiKeys();
                if (tabId === 'geofence') { loadBranches(); initBranchMap(); }
                if (tabId === 'profile') loadUsers();
                if (tabId === 'punch-types') loadPunchTypes();
                if (tabId === 'settings') loadAdmsSyncSettings();
                if (tabId === 'employees') loadEmployees();
            }
        }

        document.querySelectorAll('.nav-item[data-tab]').forEach(tab => {
            tab.addEventListener('click', (e) => {
                if (window.location.pathname === '/ui' || window.location.pathname === '/ui/') {
                    e.preventDefault();
                    const targetTab = tab.dataset.tab;
                    showTab(targetTab);
                    window.location.hash = targetTab;
                }
            });
        });

        // ── Dark Mode Toggle Handler ──────────────────────────────────
        const themeToggleBtn = document.getElementById('themeToggle');
        const darkIcon = document.getElementById('themeToggleDarkIcon');
        const lightIcon = document.getElementById('themeToggleLightIcon');

        function updateIcons() {
            if (document.documentElement.classList.contains('dark')) {
                darkIcon.classList.add('hidden');
                lightIcon.classList.remove('hidden');
            } else {
                lightIcon.classList.add('hidden');
                darkIcon.classList.remove('hidden');
            }
        }

        if (themeToggleBtn && darkIcon && lightIcon) {
            updateIcons();
            themeToggleBtn.addEventListener('click', function() {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.theme = 'light';
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.theme = 'dark';
                }
                updateIcons();
            });
        }

        function localizeTimestamps() {
            document.querySelectorAll('.local-time').forEach(el => {
                const utcStr = el.getAttribute('data-utc');
                if (utcStr) {
                    const localDate = new Date(utcStr);
                    if (!isNaN(localDate.getTime())) {
                        const year = localDate.getFullYear();
                        const month = String(localDate.getMonth() + 1).padStart(2, '0');
                        const day = String(localDate.getDate()).padStart(2, '0');
                        const hours = String(localDate.getHours()).padStart(2, '0');
                        const minutes = String(localDate.getMinutes()).padStart(2, '0');
                        const seconds = String(localDate.getSeconds()).padStart(2, '0');
                        el.textContent = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                    }
                }
            });
        }

        window.addEventListener('load', () => {
            localizeTimestamps();
            if (window.location.pathname === '/ui' || window.location.pathname === '/ui/') {
                const hash = window.location.hash.replace('#', '') || 'dashboard';
                showTab(hash);
            }
        });

        window.addEventListener('hashchange', () => {
            if (window.location.pathname === '/ui' || window.location.pathname === '/ui/') {
                const hash = window.location.hash.replace('#', '') || 'dashboard';
                showTab(hash);
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
